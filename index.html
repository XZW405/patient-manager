<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="病人管理">
<meta name="theme-color" content="#f2f4f7">
<meta name="format-detection" content="telephone=no">
<title>病人管理系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M18 26h28v6H18zm0 12h20v6H18z' fill='white'/%3E%3C/svg%3E">
<style>/* 病人管理系统 - 全局样式 */
:root {
  --bg: #f2f4f7;
  --card: #ffffff;
  --text: #111827;
  --muted: #6b7280;
  --faint: #9ca3af;
  --border: #e5e7eb;
  --accent: #2563eb;
  --accent-soft: #e8f0ff;
  --red: #dc2626;
  --red-soft: #fee2e2;
  --green: #059669;
  --green-soft: #d1fae5;
  --amber: #d97706;
  --amber-soft: #fef3c7;
  --purple: #7c3aed;
  --purple-soft: #ede9fe;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px rgba(16, 24, 40, .05);
  --radius: 16px;
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0f17;
    --card: #141a24;
    --text: #e5e7eb;
    --muted: #94a3b8;
    --faint: #64748b;
    --border: #243041;
    --accent: #60a5fa;
    --accent-soft: #1e293b;
    --red: #f87171;
    --red-soft: #3b1a1a;
    --green: #34d399;
    --green-soft: #123b2c;
    --amber: #fbbf24;
    --amber-soft: #3b2f12;
    --purple: #a78bfa;
    --purple-soft: #2a2140;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  padding-bottom: env(safe-area-inset-bottom);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
.boot { padding: 40px 20px; text-align: center; color: var(--muted); }

/* 壳 */
.app { min-height: 100vh; }
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--border);
  padding: calc(8px + env(safe-area-inset-top)) 16px 8px;
}
.topbar-inner {
  max-width: 1180px; margin: 0 auto;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.brand { display: flex; flex-direction: column; min-width: 108px; }
.brand-title { font-size: 18px; font-weight: 750; letter-spacing: -.02em; }
.brand-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
.nav {
  display: flex; gap: 4px; overflow-x: auto; flex: 1 1 auto;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.nav::-webkit-scrollbar { display: none; }
.nav-btn {
  border: 0; background: transparent; color: var(--muted);
  padding: 9px 12px; border-radius: 10px; white-space: nowrap;
  font-size: 14px; font-weight: 600;
}
.nav-btn.active { background: var(--card); color: var(--text); box-shadow: var(--shadow); }
.nav-btn .badge { margin-left: 4px; }
.top-actions { display: flex; gap: 8px; align-items: center; margin-left: auto; }
.page { max-width: 1180px; margin: 0 auto; padding: 16px 16px 48px; }
.page.narrow { max-width: 860px; }

/* 通用 */
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px;
}
.card + .card { margin-top: 12px; }
.card h2 { margin: 0 0 12px; font-size: 16px; letter-spacing: -.01em; }
.card h3 { margin: 0 0 8px; font-size: 14px; color: var(--muted); font-weight: 650; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 12px; }
.mono { font-variant-numeric: tabular-nums; }
.spacer { flex: 1; }
.hidden { display: none !important; }
.warn { color: var(--red); }
.good { color: var(--green); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 2px 0 12px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font-size: 24px; letter-spacing: -.03em; }
.page-head .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.page-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.section-gap { height: 12px; }
.ov-chip.free-only { background: color-mix(in srgb, var(--accent-soft) 55%, var(--card)); }

/* 按钮 */
.btn {
  border: 1px solid var(--border); background: var(--card); color: var(--text);
  border-radius: 12px; padding: 10px 14px; min-height: 42px;
  font-weight: 650; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: transform .05s ease, background .15s ease;
}
.btn:active { transform: scale(.985); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.soft { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--red-soft); border-color: transparent; color: var(--red); }
.btn.good { background: var(--green-soft); border-color: transparent; color: var(--green); }
.btn.small { min-height: 34px; padding: 6px 10px; font-size: 13px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn.plus {
  width: 44px; min-width: 44px; height: 44px; padding: 0;
  border-radius: 50%; background: var(--accent); border-color: var(--accent);
  color: #fff; font-size: 26px; font-weight: 400; line-height: 1;
}
.btn.plus.tiny { width: 32px; min-width: 32px; height: 32px; font-size: 20px; border-radius: 50%; }
.btn:disabled { opacity: .45; pointer-events: none; }
.icon-btn { border: 0; background: transparent; color: var(--muted); font-size: 20px; padding: 6px; border-radius: 8px; }

/* 标签/徽标 */
.badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--accent); color: #fff; font-size: 11px; font-weight: 700;
}
.tag {
  display: inline-flex; align-items: center; height: 20px; padding: 0 6px;
  border-radius: 6px; font-size: 11px; font-weight: 700; color: #fff;
  letter-spacing: .02em;
}
.tag.soft { background: var(--accent-soft); color: var(--accent); }
.teacher-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; border-radius: 50%; background: var(--purple-soft);
  color: var(--purple); font-size: 12px; font-weight: 800;
}
.teacher-badge.empty { background: var(--bg); color: var(--faint); }
.todo-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 999px; background: var(--accent-soft);
  color: var(--accent); font-size: 12px; font-weight: 700; white-space: nowrap;
}
.todo-badge.red { background: var(--red-soft); color: var(--red); }
.todo-badge.amber { background: var(--amber-soft); color: var(--amber); }
.todo-badge.grey { background: var(--bg); color: var(--muted); }
.todo-badge.green { background: var(--green-soft); color: var(--green); }

/* 统计 */
.statline { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; }
.stat {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 8px 12px; font-size: 12px; color: var(--muted); box-shadow: var(--shadow);
}
.stat b { color: var(--text); font-size: 16px; margin-right: 3px; }
.stat.red b { color: var(--red); }

/* 筛选 */
.filterbar { margin-bottom: 12px; }
.filter-row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
.filter-label { flex: 0 0 38px; color: var(--faint); font-size: 12px; padding-top: 6px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--border); background: var(--card); color: var(--muted);
  border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 650;
  display: inline-flex; align-items: center; gap: 4px; min-height: 30px;
}
.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip .count { opacity: .7; font-size: 11px; }
.chip.tag-chip { border-color: transparent; color: #fff; }
.chip.tag-chip:not(.active) { opacity: .55; }
.search {
  width: 100%; border: 1px solid var(--border); background: var(--card);
  border-radius: 12px; padding: 10px 12px; min-height: 42px; margin-bottom: 8px;
}
.search:focus, .field input:focus, .field select:focus, .field textarea:focus {
  outline: 2px solid color-mix(in srgb, var(--accent) 30%, transparent); outline-offset: 1px;
}

/* 总览 */
.ov-groups { display: grid; gap: 10px; }
.ov-group { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.ov-group.overdue { border-color: color-mix(in srgb, var(--red) 45%, var(--border)); }
.ov-title {
  display: flex; align-items: center; gap: 8px; padding: 10px 14px;
  font-weight: 750; font-size: 14px; border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg) 55%, var(--card));
}
.ov-title .count { color: var(--faint); font-size: 12px; font-weight: 600; }
.ov-group.overdue .ov-title { color: var(--red); background: var(--red-soft); }
.ov-chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 12px; }
.ov-chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border); background: var(--card); border-radius: 10px;
  padding: 7px 10px; min-height: 38px; text-align: left;
}
.ov-chip .bed { font-weight: 800; font-size: 15px; }
.ov-chip .pname { color: var(--muted); font-size: 12px; }
.ov-chip .task { color: var(--accent); font-size: 12px; font-weight: 650; }
.ov-chip .days { color: var(--red); font-size: 11px; font-weight: 700; }
.ov-chip.completed { opacity: .5; }
.ov-chip.completed .task { text-decoration: line-through; }
.ov-chip.overdue { border-color: color-mix(in srgb, var(--red) 45%, var(--border)); background: color-mix(in srgb, var(--red-soft) 45%, var(--card)); }
.ov-empty { padding: 28px 16px; text-align: center; color: var(--muted); }

/* 列表 */
.table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.patient-table { width: 100%; min-width: 720px; border-collapse: collapse; }
.patient-table th, .patient-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
.patient-table th { font-size: 12px; color: var(--muted); font-weight: 700; background: color-mix(in srgb, var(--bg) 55%, var(--card)); position: sticky; top: 0; }
.patient-table tr:last-child td { border-bottom: 0; }
.patient-table tbody tr { cursor: pointer; }
.patient-table tbody tr:hover { background: color-mix(in srgb, var(--accent-soft) 30%, var(--card)); }
.patient-table .bed { font-weight: 800; white-space: nowrap; }
.patient-table .name { font-weight: 650; }
.patient-table .diag { max-width: 180px; }
.patient-table .surgery { max-width: 190px; }
.patient-table .todo-cell { white-space: nowrap; }
.cards { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: stretch; }
.cards.single { grid-template-columns: 1fr; }
.patient-card {
  text-align: left; background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: 10px 11px;
  display: flex; flex-direction: column; gap: 4px; width: 100%; min-width: 0; height: 100%;
}
.patient-card:active { transform: scale(.995); }
.pc-top { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; min-width: 0; }
.pc-bed { font-weight: 800; font-size: 15px; }
.pc-name { font-weight: 700; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc-status { margin-left: auto; }
.pc-diag { font-size: 12px; color: var(--text); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pc-surgery { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc-bottom { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
.pc-tags { display: flex; gap: 3px; flex-wrap: wrap; margin-left: auto; }
.patient-card .teacher-badge { width: 20px; height: 20px; font-size: 10px; }
.patient-card .todo-badge { font-size: 10px; padding: 2px 6px; gap: 2px; }
.patient-card .pc-tags .tag { height: 17px; padding: 0 4px; font-size: 9px; }

/* 详情 */
.detail-back-row { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; }
.back-icon {
  width: 46px; min-width: 46px; height: 46px; border-radius: 14px;
  border: 1px solid var(--border); background: var(--card); color: var(--text);
  box-shadow: var(--shadow); display: inline-flex; align-items: center; justify-content: center;
  padding: 0;
}
.back-icon:active { transform: scale(.97); }
.detail-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.detail-title h1 { margin: 0; font-size: 24px; letter-spacing: -.03em; }
.detail-title .bed { font-size: 20px; font-weight: 800; }
.detail-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.detail-top { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
.detail-top > .card { margin-top: 0; }
.detail-top .card { padding: 12px; min-width: 0; }
.detail-top .kv { grid-template-columns: 60px minmax(0, 1fr); gap: 5px 7px; font-size: 12px; line-height: 1.4; }
.detail-top .kv dt { white-space: nowrap; font-size: 11px; }
.detail-top .kv dd { min-width: 0; overflow-wrap: anywhere; }
.detail-top .card h2 { font-size: 14px; }
.detail-top .card h3 { font-size: 12px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.card-head h2 { margin: 0; }
.info-card .note-text { max-height: 120px; overflow-y: auto; }
.todo-card .task-list { min-width: 0; }
.kv { display: grid; grid-template-columns: 92px 1fr; gap: 6px 10px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.text-block { white-space: pre-wrap; word-break: break-word; }
.tasks { display: grid; gap: 8px; }
.task-card {
  border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.task-card.overdue { border-color: color-mix(in srgb, var(--red) 45%, var(--border)); background: color-mix(in srgb, var(--red-soft) 35%, var(--card)); }
.task-card .task-name { font-weight: 700; }
.task-card .task-due { color: var(--muted); font-size: 12px; }
.task-card .task-actions { margin-left: auto; display: flex; gap: 6px; }
.task-list { display: grid; gap: 2px; }
.task-row { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; padding: 7px 0; border-bottom: 1px dashed var(--border); }
.task-row:last-child { border-bottom: 0; }
.task-row.overdue .task-rel { color: var(--red); }
.task-row.upcoming .task-rel { color: var(--amber); }
.task-main { flex: 1 1 100px; min-width: 0; display: flex; align-items: baseline; justify-content: space-between; gap: 6px; padding: 0; border: 0; background: transparent; color: inherit; text-align: left; }
.task-name { font-weight: 700; font-size: 13px; line-height: 1.35; }
.task-every { color: var(--faint); font-size: 10px; font-weight: 500; margin-left: 4px; white-space: nowrap; }
.task-rel { color: var(--accent); font-size: 11px; font-weight: 650; white-space: nowrap; }
.task-row .task-actions { margin-left: auto; display: flex; align-items: center; gap: 2px; }
.task-row .icon-btn { padding: 2px 4px; font-size: 14px; }
.task-row .btn.small { min-height: 28px; padding: 3px 8px; font-size: 12px; border-radius: 8px; }
.history { display: grid; gap: 6px; }
.history-item { display: flex; gap: 8px; align-items: baseline; font-size: 13px; padding: 6px 0; border-bottom: 1px dashed var(--border); }
.history-item:last-child { border-bottom: 0; }
.history-date { color: var(--faint); font-size: 12px; min-width: 44px; }
.history-main { flex: 1; min-width: 0; }
.history-note { color: var(--muted); font-size: 12px; }
.history-edit { margin-left: auto; flex: 0 0 auto; }
.history-group { border: 1px solid var(--border); border-radius: 12px; padding: 8px 10px; margin: 8px 0; }
.history-group-head { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0 6px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
.detail-footer { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 0; padding-top: 14px; border-top: 1px solid var(--border); }
.detail-footer .btn { flex: 1 1 120px; }
.photo-label { color: var(--muted); font-size: 12px; font-weight: 650; margin-bottom: 6px; }

/* 空状态 */
.empty { text-align: center; padding: 36px 16px; color: var(--muted); }
.empty h3 { color: var(--text); margin: 8px 0 6px; }
.empty p { margin: 0 0 14px; }

/* 表单 */
.form-section { margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 12px; color: var(--muted); font-weight: 650; }
.field input, .field select, .field textarea {
  border: 1px solid var(--border); background: var(--card); border-radius: 10px;
  padding: 9px 10px; min-height: 42px; font-size: 16px; width: 100%;
}
.field textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
.field .hint { font-size: 11px; color: var(--faint); }
.seg { display: inline-flex; background: var(--bg); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 6px 10px; border-radius: 8px; font-size: 13px; font-weight: 650; }
.seg button.active { background: var(--card); color: var(--text); box-shadow: var(--shadow); }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.switch-row:last-child { border-bottom: 0; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
.check input { width: 18px; height: 18px; }
.form-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 0; }
.form-note { background: var(--accent-soft); color: var(--accent); border-radius: 10px; padding: 9px 11px; font-size: 12px; margin: 0 0 12px; }

/* 设置 */
.settings { display: grid; gap: 12px; }
.settings .card h2 { display: flex; align-items: center; justify-content: space-between; }
.list-row { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); }
.list-row:last-child { border-bottom: 0; }
.list-row input[type="text"] { flex: 1; border: 1px solid var(--border); background: var(--card); border-radius: 9px; padding: 8px 10px; min-height: 38px; }
.color-input { width: 38px; height: 38px; padding: 0; border: 1px solid var(--border); border-radius: 9px; background: var(--card); }

/* 照片 */
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.photo {
  position: relative; aspect-ratio: 1 / 1; border-radius: 12px; overflow: hidden;
  background: var(--bg); border: 1px solid var(--border); padding: 0;
}
.photo-wrap { position: relative; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-del {
  position: absolute; top: 4px; right: 4px; width: 24px; height: 24px;
  border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 14px;
  line-height: 24px; text-align: center; padding: 0;
}
.photo-add {
  aspect-ratio: 1 / 1; border: 1px dashed var(--border); border-radius: 12px;
  background: transparent; color: var(--muted); font-size: 24px; display: flex; align-items: center; justify-content: center;
}
.photo-caption { font-size: 11px; color: var(--muted); margin-top: 3px; }

/* 弹层 */
.modal-backdrop, .sheet-backdrop {
  position: fixed; inset: 0; z-index: 100; background: rgba(10, 15, 25, .45);
  display: flex; align-items: center; justify-content: center; padding: 18px;
}
.sheet-backdrop { align-items: flex-end; padding: 0; }
.modal-card {
  background: var(--card); color: var(--text); border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.25);
  width: min(560px, 100%); max-height: 86vh; display: flex; flex-direction: column; overflow: hidden;
}
.sheet {
  background: var(--card); color: var(--text); border-radius: 20px 20px 0 0;
  width: 100%; max-height: 88vh; display: flex; flex-direction: column; overflow: hidden;
  padding-bottom: env(safe-area-inset-bottom);
}
.modal-head, .sheet-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 14px 16px; border-bottom: 1px solid var(--border); font-weight: 750;
}
.sheet-head::before {
  content: ""; position: absolute; left: 50%; top: 6px; width: 36px; height: 4px;
  margin-left: -18px; border-radius: 2px; background: var(--border);
}
.sheet-head { position: relative; padding-top: 20px; }
.modal-body, .sheet-body { padding: 14px 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.modal-actions, .sheet-actions { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.modal-actions .btn, .sheet-actions .btn { flex: 1; }
.close-x { border: 0; background: transparent; color: var(--muted); font-size: 20px; padding: 4px 8px; }

/* 提示 */
.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom));
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 200;
  background: #111827; color: #fff; border-radius: 12px; padding: 10px 12px;
  display: flex; align-items: center; gap: 10px; font-size: 13px; max-width: calc(100% - 32px);
  box-shadow: 0 10px 30px rgba(0,0,0,.25); transition: opacity .18s ease, transform .18s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { border: 0; background: transparent; color: #93c5fd; font-weight: 750; padding: 4px 6px; }

/* 安装提示 */
.install-wrap { max-width: 560px; margin: 0 auto; padding: 40px 18px; }
.install-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow); padding: 22px; }
.install-card h1 { margin: 0 0 6px; font-size: 24px; }
.install-card p { color: var(--muted); }
.install-steps { margin: 16px 0 0; padding-left: 20px; }
.install-steps li { margin-bottom: 10px; }
.install-url { background: var(--bg); border-radius: 10px; padding: 10px; word-break: break-all; font-size: 13px; margin-top: 12px; }

/* 版本 */
.version { text-align: center; color: var(--faint); font-size: 11px; padding: 18px 16px 34px; }

@media (max-width: 640px) {
  .topbar { padding-left: 12px; padding-right: 12px; }
  .brand { min-width: auto; }
  .brand-title { font-size: 16px; }
  .brand-sub { display: none; }
  .top-actions .btn span.long { display: none; }
  .page { padding: 12px 12px 40px; }
  .page-head h1 { font-size: 21px; }
  .filter-label { flex-basis: 32px; }
  .detail-title h1 { font-size: 21px; }
}

<body>
<div id="app"><div class="boot">加载中…</div></div>
<div id="toast" class="toast" role="status"></div>
<div id="modal-root"></div>
<noscript><div class="boot">需要开启 JavaScript 才能使用。</div></noscript>
<script>window.APP_VERSION = 'v2026.10.22.0059';</script>
<script>/* ==== src/engine.js ==== */
/*
 * 病人管理系统 - 任务引擎
 * 纯函数，不依赖 DOM / IndexedDB。浏览器挂到 window.Engine，Node 用 module.exports。
 * 日期一律用本地日期字符串 YYYY-MM-DD；天数用 UTC 计算，避开夏令时。
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.Engine = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const DEFAULTS = {
    drainOffset: 1,
    firstDressingInterval: 2,
    dressingInterval: 2,
    stitchOffset: 14
  };

  const TASK_LABELS = {
    preop: '备术',
    preop_film: '备术',
    preop_mark: '备术',
    drain: '待拔管',
    dressing: '换药',
    stitch: '拆线'
  };

  const TASK_CATEGORY = {
    preop: 'preop',
    preop_film: 'preop',
    preop_mark: 'preop',
    drain: 'drain',
    dressing: 'dressing',
    stitch: 'stitch'
  };

  // 旧数据里可能同时有理胶片 / 画标记两条；新规则只保留一个「备术」任务。
  const PREOP_TYPES = ['preop', 'preop_film', 'preop_mark'];
  const COMMON_TASK_LABELS = { dressing: '换药', stitch: '拆线', preop: '备术', drain: '待拔管' };

  const ACTION_LABELS = {
    done: '已完成',
    senior: '上级处理',
    defer: '明天再做',
    not_needed: '不再需要',
    nonplanned: '非计划换药'
  };

  const CATEGORY_ORDER = ['overdue', 'preop', 'surgery', 'drain', 'dressing', 'stitch', 'other', 'free'];
  const CATEGORY_LABELS = {
    overdue: '逾期',
    preop: '备术',
    surgery: '手术',
    drain: '拔管',
    dressing: '换药',
    stitch: '拆线',
    other: '其他待办',
    free: '自由待办'
  };

  // ---------- 日期 ----------
  function pad2(n) { return String(n).padStart(2, '0'); }

  function parseYMD(s) {
    if (!s || typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
    const p = s.split('-').map(Number);
    const d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
    if (d.getUTCFullYear() !== p[0] || d.getUTCMonth() !== p[1] - 1 || d.getUTCDate() !== p[2]) return null;
    return d;
  }

  function toYMD(d) {
    if (!(d instanceof Date) || isNaN(d.getTime())) return '';
    return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
  }

  function addDays(ymd, n) {
    const d = parseYMD(ymd);
    if (!d) return '';
    d.setUTCDate(d.getUTCDate() + Number(n || 0));
    return toYMD(d);
  }

  function diffDays(a, b) {
    const da = parseYMD(a);
    const db = parseYMD(b);
    if (!da || !db) return null;
    return Math.round((da.getTime() - db.getTime()) / 86400000);
  }

  function todayYMD(now) {
    const d = now instanceof Date ? now : new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function validDate(ymd) { return !!parseYMD(ymd); }

  // ISO 时间戳 -> 本地 YYYY-MM-DD。补录基线按用户录入当天计算。
  function localDateFromISO(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function admissionStartDate(admission) {
    if (!admission) return '';
    if (validDate(admission.taskStartDate)) return admission.taskStartDate;
    return localDateFromISO(admission.createdAt);
  }

  function relativeDayLabel(due, today) {
    if (!due) return '未定';
    const n = diffDays(due, today);
    if (n == null) return '未定';
    if (n === 0) return '今天';
    if (n > 0) return n + ' 天后';
    return '逾期 ' + (-n) + ' 天';
  }

  function cnNumber(n) {
    const num = Number(n);
    if (!num || num < 1) return '';
    if (num > 99) return String(num);
    const d = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
    if (num < 10) return d[num];
    if (num === 10) return '十';
    if (num < 20) return '十' + d[num % 10];
    return d[Math.floor(num / 10)] + '十' + (num % 10 ? d[num % 10] : '');
  }

  function dressingLabel(n) {
    return '换药' + cnNumber(n);
  }

  // ---------- 事件 ----------
  function eventCmp(a, b) {
    const da = a.date || '';
    const db = b.date || '';
    if (da !== db) return da < db ? -1 : 1;
    const ca = a.createdAt || '';
    const cb = b.createdAt || '';
    if (ca !== cb) return ca < cb ? -1 : 1;
    return String(a.id || '').localeCompare(String(b.id || ''));
  }

  function sortEvents(evs) { return (evs || []).slice().sort(eventCmp); }

  function latestEvent(evs) {
    const list = sortEvents(evs);
    return list.length ? list[list.length - 1] : null;
  }

  function terminalEvent(evs) {
    return latestEvent((evs || []).filter(function (e) {
      return e.action === 'done' || e.action === 'senior' || e.action === 'not_needed';
    }));
  }

  function latestAction(evs, actions) {
    return latestEvent((evs || []).filter(function (e) { return actions.indexOf(e.action) >= 0; }));
  }

  function applyDefer(baseDue, evs) {
    if (!baseDue) return baseDue;
    const defers = (evs || []).filter(function (e) {
      return e.action === 'defer' && e.date && e.date >= baseDue;
    });
    if (!defers.length) return baseDue;
    const last = latestEvent(defers);
    const laterActual = (evs || []).some(function (e) {
      return (e.action === 'done' || e.action === 'senior' || e.action === 'nonplanned') &&
        eventCmp(e, last) > 0;
    });
    if (laterActual) return baseDue;
    const next = addDays(last.date, 1);
    return next && next > baseDue ? next : baseDue;
  }

  function dueStatus(due, today) {
    if (!due) return 'unscheduled';
    if (due > today) return 'upcoming';
    if (due === today) return 'pending';
    return 'overdue';
  }

  function taskPlan(admission, type) {
    return admission && admission.taskPlans && admission.taskPlans[type] ? admission.taskPlans[type] : null;
  }

  function planHasLaterEvent(plan, evs) {
    if (!plan || !plan.setAt) return false;
    return (evs || []).some(function (e) {
      return (e.action === 'done' || e.action === 'senior' || e.action === 'nonplanned') &&
        String(e.createdAt || '') > String(plan.setAt || '');
    });
  }

  function planDue(plan, evs, fallback) {
    if (plan && validDate(plan.dueDate) && !planHasLaterEvent(plan, evs)) return plan.dueDate;
    return fallback;
  }

  function planInterval(plan, fallback) {
    const n = plan && Number(plan.interval);
    return n && n > 0 ? n : fallback;
  }

  function overdueDaysFor(due, today, status) {
    if (status !== 'overdue' || !due) return 0;
    const n = diffDays(today, due);
    return n && n > 0 ? n : 0;
  }

  function makeTask(admission, type, label, category, dueDate, status, actions, extra, today) {
    const key = admission.id + ':' + type;
    return Object.assign({
      key: key,
      admissionId: admission.id,
      patientId: admission.patientId,
      type: type,
      label: label,
      category: category,
      dueDate: dueDate || '',
      status: status,
      overdueDays: overdueDaysFor(dueDate, today, status),
      relative: relativeDayLabel(dueDate, today),
      actions: actions
    }, extra || {});
  }

  function completion(admission, taskType, label, ev, extra) {
    return Object.assign({
      key: admission.id + ':done:' + taskType + ':' + (ev.id || ev.date + ev.action),
      admissionId: admission.id,
      patientId: admission.patientId,
      eventId: ev.id || '',
      type: taskType,
      taskType: taskType,
      label: label,
      date: ev.date,
      action: ev.action,
      bySenior: ev.action === 'senior',
      note: ev.note || ''
    }, extra || {});
  }

  function freeTaskType(id) { return 'free:' + id; }

  function historyFor(evs, freeTodos) {
    const freeMap = {};
    (freeTodos || []).forEach(function (f) { freeMap[freeTaskType(f.id)] = f.title || '待办'; });
    let dressingNo = 0;
    return sortEvents(evs).map(function (e) {
      let label = TASK_LABELS[e.taskType] || freeMap[e.taskType] || '待办';
      if (e.taskType === 'dressing' &&
        (e.action === 'done' || e.action === 'senior' || e.action === 'nonplanned')) {
        dressingNo += 1;
        label = dressingLabel(dressingNo);
      }
      return {
        id: e.id,
        eventId: e.id,
        date: e.date,
        type: e.taskType,
        taskType: e.taskType,
        freeTodoId: e.sourceFreeTodoId || '',
        label: label,
        action: e.action,
        actionLabel: ACTION_LABELS[e.action] || e.action,
        bySenior: e.action === 'senior',
        note: e.note || ''
      };
    }).reverse();
  }

  // ---------- 单次住院排期 ----------
  function computeAdmission(admission, events, freeTodos, settings, today) {
    const s = Object.assign({}, DEFAULTS, settings || {});
    const t = today || todayYMD();
    const tasks = [];
    const completedToday = [];

    const empty = {
      tasks: [], current: [], completedToday: [], history: [],
      stitchDue: '', drainDate: '', nextDressingDate: '', stitchEnded: false,
      baselineDate: '', backfilled: false, skippedBeforeStart: 0
    };
    if (!admission || admission.deletedAt || admission.status !== 'admitted') return empty;

    const allEvents = (events || []).filter(function (e) {
      return e.admissionId === admission.id && !e.deletedAt;
    });
    const surgeryDate = admission.surgeryDate || '';
    const stitchDue = surgeryDate ? addDays(surgeryDate, s.stitchOffset) : '';
    const start = admissionStartDate(admission);
    let skippedBeforeStart = 0;
    const beforeStart = function (due) {
      return !!(start && due && due < start);
    };
    let drainDate = '';
    let nextDressingDate = '';
    let stitchEnded = false;

    // 术前：D-1。旧数据的理胶片 / 画标记合并成一个「备术」。
    if (surgeryDate) {
      const preopDue = addDays(surgeryDate, -1);
      const evs = allEvents.filter(function (e) { return PREOP_TYPES.indexOf(e.taskType) >= 0; });
      const term = terminalEvent(evs);
      if (term) {
        const status = term.action === 'not_needed' ? 'not_needed' : 'done';
        tasks.push(makeTask(admission, 'preop', '备术', 'preop', preopDue, status,
          ['done', 'defer', 'senior', 'not_needed'], {
            doneDate: term.date,
            bySenior: term.action === 'senior',
            eventId: term.id
          }, t));
        if ((term.action === 'done' || term.action === 'senior') && term.date === t) {
          completedToday.push(completion(admission, 'preop', '备术', term));
        }
      } else {
        const plan = taskPlan(admission, 'preop');
        const manual = !!(plan && validDate(plan.dueDate) && !planHasLaterEvent(plan, evs));
        let due = planDue(plan, evs, preopDue);
        due = applyDefer(due, evs);
        if (beforeStart(due) && !manual) {
          skippedBeforeStart += 1;
        } else {
          const status = dueStatus(due, t);
          const preopLate = surgeryDate <= t && (status === 'pending' || status === 'overdue');
          tasks.push(makeTask(admission, 'preop', '备术', 'preop', due, status,
            ['done', 'defer', 'senior', 'not_needed'], {
              preopLate: preopLate,
              flag: preopLate ? '术前未完成' : ''
            }, t));
        }
      }
    }

    // 拔管：术后 D1；所有手术都有引流管。
    if (surgeryDate) {
      const drainDue = addDays(surgeryDate, s.drainOffset);
      const evs = allEvents.filter(function (e) { return e.taskType === 'drain'; });
      const term = terminalEvent(evs);
      if (term) {
        if (term.action === 'done' || term.action === 'senior') drainDate = term.date;
        const status = term.action === 'not_needed' ? 'not_needed' : 'done';
        tasks.push(makeTask(admission, 'drain', '待拔管', 'drain', drainDue, status,
          ['done', 'defer', 'senior'], {
            doneDate: term.date,
            bySenior: term.action === 'senior',
            eventId: term.id
          }, t));
        if ((term.action === 'done' || term.action === 'senior') && term.date === t) {
          completedToday.push(completion(admission, 'drain', '待拔管', term));
        }
      } else {
        const plan = taskPlan(admission, 'drain');
        const manual = !!(plan && validDate(plan.dueDate) && !planHasLaterEvent(plan, evs));
        let due = planDue(plan, evs, drainDue);
        due = applyDefer(due, evs);
        if (beforeStart(due) && !manual) {
          // 补录：录入前应已拔管，按默认日期作为后续换药的锚点。
          skippedBeforeStart += 1;
          drainDate = due;
        } else {
          tasks.push(makeTask(admission, 'drain', '待拔管', 'drain', due, dueStatus(due, t),
            ['done', 'defer', 'senior'], {}, t));
        }
      }
    }

    // 拆线：术后 D14。
    if (surgeryDate && stitchDue) {
      const evs = allEvents.filter(function (e) { return e.taskType === 'stitch'; });
      const term = terminalEvent(evs);
      if (term) {
        stitchEnded = true;
        const status = term.action === 'not_needed' ? 'not_needed' : 'done';
        tasks.push(makeTask(admission, 'stitch', '拆线', 'stitch', stitchDue, status,
          ['done', 'defer', 'senior', 'not_needed'], {
            doneDate: term.date,
            bySenior: term.action === 'senior',
            eventId: term.id
          }, t));
        if ((term.action === 'done' || term.action === 'senior') && term.date === t) {
          completedToday.push(completion(admission, 'stitch', '拆线', term));
        }
      } else {
        const plan = taskPlan(admission, 'stitch');
        const manual = !!(plan && validDate(plan.dueDate) && !planHasLaterEvent(plan, evs));
        let due = planDue(plan, evs, stitchDue);
        due = applyDefer(due, evs);
        if (beforeStart(due) && !manual) {
          skippedBeforeStart += 1;
          stitchEnded = true;
        } else {
          tasks.push(makeTask(admission, 'stitch', '拆线', 'stitch', due, dueStatus(due, t),
            ['done', 'defer', 'senior', 'not_needed'], {}, t));
        }
      }
    }

    // 换药：拔管完成日 + 首次间隔；每次实际操作 + 间隔；与拆线撞日只留拆线。
    if (drainDate && stitchDue && !stitchEnded) {
      const firstDue = addDays(drainDate, s.firstDressingInterval);
      if (firstDue && firstDue < stitchDue) {
        const evs = allEvents.filter(function (e) { return e.taskType === 'dressing'; });
        const term = terminalEvent(evs);
        const anchor = latestAction(evs, ['done', 'senior', 'nonplanned']);
        const stopped = term && term.action === 'not_needed' &&
          (!anchor || eventCmp(term, anchor) > 0);
        const plan = taskPlan(admission, 'dressing');
        const interval = planInterval(plan, s.dressingInterval);

        if (!stopped) {
          let baseDue = anchor ? addDays(anchor.date, interval) : firstDue;
          let stepped = false;
          // 录入前已经到期的换药，按默认间隔一路推到现在 / 未来。
          let guard = 0;
          while (baseDue && beforeStart(baseDue) && guard < 500) {
            skippedBeforeStart += 1;
            stepped = true;
            baseDue = addDays(baseDue, interval);
            guard += 1;
          }
          // 患者单独设置的“下一次日期”优先；设置之后已有操作则按操作重新算。
          const manualDue = !!(plan && validDate(plan.dueDate) && !planHasLaterEvent(plan, evs));
          if (manualDue) baseDue = plan.dueDate;
          let due = baseDue ? applyDefer(baseDue, evs) : '';
          if (due && beforeStart(due) && !manualDue) {
            while (due && beforeStart(due) && guard < 500) {
              skippedBeforeStart += 1;
              stepped = true;
              due = addDays(due, interval);
              guard += 1;
            }
          }
          if (due && due < stitchDue) {
            nextDressingDate = due;
            tasks.push(makeTask(admission, 'dressing', '换药', 'dressing', due, dueStatus(due, t),
              ['done', 'defer', 'senior', 'not_needed'], {
                firstDue: firstDue,
                anchorDate: anchor ? anchor.date : '',
                interval: interval,
                planInterval: plan && plan.interval ? Number(plan.interval) : '',
                stepped: stepped
              }, t));
          }
        }

        evs.forEach(function (e) {
          if (e.date === t && (e.action === 'done' || e.action === 'senior' || e.action === 'nonplanned')) {
            const label = e.action === 'nonplanned' ? '非计划换药' : '换药';
            completedToday.push(completion(admission, 'dressing', label, e));
          }
        });
      }
    }

    // 自由待办：只算锚定在本住院的；未锚定的只在总览出现。
    (freeTodos || []).forEach(function (f) {
      if (!f || f.deletedAt || f.admissionId !== admission.id || f.doneAt) return;
      const type = freeTaskType(f.id);
      const evs = allEvents.filter(function (e) { return e.taskType === type; });
      const term = terminalEvent(evs);
      const label = f.title || COMMON_TASK_LABELS[f.kind] || '待办';
      const actions = ['done', 'defer', 'senior', 'not_needed'];
      const plan = taskPlan(admission, type);

      if (f.type === 'once') {
        if (term) {
          const status = term.action === 'not_needed' ? 'not_needed' : 'done';
          tasks.push(makeTask(admission, type, label, 'other', f.dueDate || '', status, actions, {
            freeTodoId: f.id, kind: f.kind || 'custom', doneDate: term.date,
            bySenior: term.action === 'senior', eventId: term.id
          }, t));
          if ((term.action === 'done' || term.action === 'senior') && term.date === t) {
            completedToday.push(completion(admission, type, label, term));
          }
          return;
        }
        const due = applyDefer(planDue(plan, evs, f.dueDate || ''), evs);
        tasks.push(makeTask(admission, type, label, 'other', due, dueStatus(due, t), actions, {
          freeTodoId: f.id, kind: f.kind || 'custom'
        }, t));
        return;
      }

      // repeat
      const anchor = latestAction(evs, ['done', 'senior']);
      const stopped = term && term.action === 'not_needed' &&
        (!anchor || eventCmp(term, anchor) > 0);
      if (stopped) {
        tasks.push(makeTask(admission, type, label, 'other', '', 'not_needed', actions, {
          freeTodoId: f.id, kind: f.kind || 'custom'
        }, t));
        return;
      }
      const interval = planInterval(plan, Number(f.interval || 2));
      const base = anchor ? addDays(anchor.date, interval) : (f.dueDate || '');
      const due = base ? applyDefer(planDue(plan, evs, base), evs) : '';

      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +

        const h0 = bitmap.height || bitmap.naturalHeight;
        const ratio = Math.min(1, max / Math.max(w0, h0));
        const w = Math.max(1, Math.round(w0 * ratio));
        const h = Math.max(1, Math.round(h0 * ratio));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');

        root.createImageBitmap(file).then(finish).catch(function () { fallback(); });

      }

        const url = URL.createObjectURL(file);

        img.onload = function () { URL.revokeObjectURL(url); finish(img); };

  function photoGrid(app, list, ownerType, ownerId) {
    const items = (list || []).map(function (p) {
      return '<div class="photo-wrap">' +
        '<button class="photo" data-act="view-photo" data-id="' + esc(p.id) + '"><img data-photo="' + esc(p.id) + '" alt=""></button>' +
        '<button class="photo-del" data-act="delete-photo" data-id="' + esc(p.id) + '" aria-label="删除">×</button>' +
        '</div>';
    }).join('');
    return '<div class="photo-grid">' + items +
      '<button class="photo-add" data-act="add-photo" data-owner-type="' + esc(ownerType) + '" data-owner-id="' + esc(ownerId) + '">+</button>' +
      '</div>';
  }

  function intakePhotoGrid(app, d) {
    const items = (d.photos || []).map(function (p, i) {
      if (p.removed) return '';
      if (p.existing) {
        return '<div class="photo-wrap">' +
          '<button class="photo" data-act="view-photo" data-id="' + esc(p.id) + '"><img data-photo="' + esc(p.id) + '" alt=""></button>' +
          '<button class="photo-del" data-act="intake-photo-remove" data-index="' + i + '">×</button>' +
          '</div>';
      }
      return '<div class="photo-wrap">' +
        '<button class="photo" data-act="view-photo-url" data-url="' + esc(p.url) + '"><img src="' + esc(p.url) + '" alt=""></button>' +
        '<button class="photo-del" data-act="intake-photo-remove" data-index="' + i + '">×</button>' +
        '</div>';
    }).join('');
    return '<div class="photo-grid">' + items +
      '<button class="photo-add" data-act="intake-photo-add">+</button>' +
      '</div>';
  }

  function textBlock(v) {
    if (!v) return '<span class="faint">未填写</span>';
    return '<div class="text-block">' + esc(v) + '</div>';
  }

  function intakeHas(d) {
    const i = d.intake || {};
    const knee = i.knee || {};
    const hip = i.hip || {};
    const rom = [knee.rom1, knee.rom2, knee.rom3].some(function (x) { return x !== '' && x != null; });
    const lig = ['mcl', 'lcl', 'acl', 'pcl'].some(function (k) {
      return knee[k] && knee[k] !== 'not_examined';
    });
    return !!(i.presentIllness || i.pastHistory || i.recentTests ||
      (i.surgeryHistory && i.surgeryHistory.has === 'yes') ||
      (i.traumaHistory && i.traumaHistory.has === 'yes') ||
      (i.allergyHistory && i.allergyHistory.has === 'yes') ||
      rom || lig ||
      (hip.strength || hip.posture) ||
      i.notes);
  }

  // ---------- 总览 ----------
  Views.overview = function (app) {
    const ov = app.overview();
    const day = app.state.overviewDay;
    const groups = day === 'tomorrow' ? ov.tomorrow : ov.today;
    const order = root.Engine.CATEGORY_ORDER;
    const labels = root.Engine.CATEGORY_LABELS;
    const tomorrowDate = root.Engine.addDays(app.state.today, 1);

    let body = '';
    const cats = order.filter(function (cat) {
      if (day === 'tomorrow' && cat === 'overdue') return false;
      return (groups[cat] || []).length > 0;
    }).sort(function (a, b) {
      const ea = (groups[a] || []).reduce(function (m, r) { const d = r.earliestDue || '9999-12-31'; return d < m ? d : m; }, '9999-12-31');
      const eb = (groups[b] || []).reduce(function (m, r) { const d = r.earliestDue || '9999-12-31'; return d < m ? d : m; }, '9999-12-31');
      return ea < eb ? -1 : (ea > eb ? 1 : 0);
    });
    cats.forEach(function (cat) {
      const rows = groups[cat] || [];
      const openCount = rows.filter(function (r) { return !r.completed; }).length;
      const doneCount = rows.length - openCount;
      const chips = rows.map(function (r) {
        const taskLabels = (r.labels || []).join(' / ');
        const isFree = !r.admissionId;
        const action = isFree ? 'free-todo' : (r.completed ? 'history' : (r.tasks && r.tasks.length ? 'tasks' : 'detail'));
        const attrs = isFree
          ? 'data-id="' + esc(r.freeTodoId) + '"'
          : (action === 'tasks' ? 'data-admission="' + esc(r.admissionId) + '"' : 'data-id="' + esc(r.admissionId) + '"');
        return '<button class="ov-chip ' + (r.completed ? 'completed' : '') + ' ' + (cat === 'overdue' ? 'overdue' : '') + ' ' + (isFree ? 'free-only' : '') + '" ' +
          'data-act="' + action + '" ' + attrs + '>' +
          (r.completed ? '<span class="good">✓</span>' : '') +
          (r.bed ? '<span class="bed">' + esc(r.bed) + '</span>' : '') +
          (isFree ? '' : '<span class="pname">' + esc(r.name) + '</span>') +
          '<span class="task">' + esc(taskLabels || labels[cat]) + '</span>' +
          (r.overdueDays ? '<span class="days">逾期' + r.overdueDays + '天</span>' : '') +
          '</button>';
      }).join('');
      body += '<section class="ov-group ' + cat + '">' +
        '<div class="ov-title"><span>' + labels[cat] + '</span>' +
        '<span class="count">' + (openCount ? openCount + (cat === 'free' ? ' 项' : ' 人') + '待办' : '') + (doneCount ? (openCount ? ' · ' : '') + doneCount + (cat === 'free' ? ' 项' : ' 人') + '已完成' : '') + '</span></div>' +
        '<div class="ov-chips">' + chips + '</div></section>';
    });

    if (!body) {
      if (!ov.stats.inHospital) {
        body = '<div class="empty"><h3>还没有在院病人</h3><p>值班新收在「待入院」里写病史；平时收病人用患者页右上角「+」。</p>' +
          '<button class="btn" data-nav="pending">去待入院</button></div>';
      } else {
        body = '<div class="empty"><h3>' + (day === 'tomorrow' ? '明天暂时没有排定任务' : '今天没有待办') + '</h3><p>可以到患者列表查看全部病人。</p></div>';
      }
    }

    const unfinished = ov.unfinishedToday || 0;
    return '<div class="page-head"><div><h1>总览</h1><div class="sub">' +
      (day === 'tomorrow' ? '明日 ' + root.UI.fmtDate(tomorrowDate) + ' ' + root.UI.weekday(tomorrowDate)
        : '今日 ' + root.UI.fmtDate(app.state.today) + ' ' + root.UI.weekday(app.state.today)) +
      ' · 在院 ' + ov.stats.inHospital + ' 人</div></div>' +
      '<div class="page-actions">' +
      '<div class="seg"><button class="' + (day === 'today' ? 'active' : '') + '" data-act="ov-day" data-value="today">今日</button>' +
      '<button class="' + (day === 'tomorrow' ? 'active' : '') + '" data-act="ov-day" data-value="tomorrow">明日</button></div>' +
      '<button class="btn small ghost" data-act="history">历史</button>' +
      '<button class="btn plus" data-act="free-todo" aria-label="加自由待办" title="加自由待办">+</button>' +
      '</div></div>' +
      '<div class="statline">' +
      '<span class="stat"><b>' + ov.stats.inHospital + '</b>在院</span>' +
      '<span class="stat"><b>' + ov.stats.todayTodo + '</b>今日待办</span>' +
      '<span class="stat ' + (ov.stats.overdue ? 'red' : '') + '"><b>' + ov.stats.overdue + '</b>逾期</span>' +
      '<span class="stat"><b>' + app.pendingList().length + '</b>待入院</span>' +
      '</div>' +
      (day === 'tomorrow' && unfinished ? '<div class="form-note">今日还有 ' + unfinished + ' 项未完成，明日会转成逾期。</div>' : '') +
      '<div class="ov-groups">' + body + '</div>';
  };

  // ---------- 患者列表 ----------
  Views.list = function (app) {
    const s = app.state.data.settings;
    const counts = app.filterCounts();
    const stats = app.overview().stats;
    const items = app.filtered();
    const total = app.admittedList().length;
    const f = app.state.filter;
    const cf = s.cardFields || {};

    function chip(label, active, act, value, count, extraClass, style) {
      return '<button class="chip ' + (active ? 'active' : '') + ' ' + (extraClass || '') + '" ' +
        (style ? 'style="' + style + '" ' : '') +
        'data-act="' + act + '" data-value="' + esc(value) + '">' + esc(label) +
        (count != null ? ' <span class="count">' + count + '</span>' : '') + '</button>';
    }

    const teacherChips = [chip('全部', f.teacherId === 'all', 'filter-teacher', 'all', counts.surgery.all)]
      .concat((s.teachers || []).map(function (t) {
        return chip(t.name, f.teacherId === t.id, 'filter-teacher', t.id, counts.teachers[t.id] || 0);
      }))
      .concat([chip('未分配', f.teacherId === 'unassigned', 'filter-teacher', 'unassigned', counts.teachers[''] || 0)])
      .join('');

    const surgeryChips = [
      chip('全部', f.surgery === 'all', 'filter-surgery', 'all', counts.surgery.all),
      chip('未手术', f.surgery === 'not_operated', 'filter-surgery', 'not_operated', counts.surgery.not_operated),
      chip('今术', f.surgery === 'today', 'filter-surgery', 'today', counts.surgery.today),
      chip('明术', f.surgery === 'tomorrow', 'filter-surgery', 'tomorrow', counts.surgery.tomorrow),
      chip('术后', f.surgery === 'postop', 'filter-surgery', 'postop', counts.surgery.postop)
    ].join('');

    const tagChips = (s.tags || []).map(function (t) {
      const active = f.tagIds.indexOf(t.id) >= 0;
      return chip(t.label, active, 'filter-tag', t.id, counts.tags[t.id] || 0, 'tag-chip',
        'background:' + (t.color || '#64748b') + ';border-color:' + (t.color || '#64748b') + ';color:#fff');
    }).join('');

    const activeBits = [];
    if (f.teacherId !== 'all') activeBits.push(f.teacherId === 'unassigned' ? '未分配老师' : teacherName(app, f.teacherId));
    if (f.surgery !== 'all') {
      activeBits.push({ not_operated: '未手术', today: '今术', tomorrow: '明术', postop: '术后' }[f.surgery]);
    }
    f.tagIds.forEach(function (id) {
      const t = (s.tags || []).find(function (x) { return x.id === id; });
      if (t) activeBits.push(t.label);
    });
    if (app.state.q) activeBits.push('搜索「' + app.state.q + '」');

    const filterBar = '<div class="filterbar">' +
      '<input class="search" id="search-input" data-input="search" placeholder="搜索姓名 / 床号 / 诊断" value="' + esc(app.state.q) + '">' +
      '<div class="filter-row"><span class="filter-label">老师</span><div class="chips">' + teacherChips + '</div></div>' +
      '<div class="filter-row"><span class="filter-label">手术</span><div class="chips">' + surgeryChips + '</div></div>' +
      '<div class="filter-row"><span class="filter-label">标签</span><div class="chips">' + (tagChips || '<span class="faint small">设置里可添加标签</span>') + '</div></div>' +
      (activeBits.length ? '<div class="row small muted" style="margin-top:6px"><span>筛选：' + esc(activeBits.join(' · ')) + ' → ' + items.length + ' 人</span>' +
        '<button class="btn small ghost" data-act="filter-reset">重置</button></div>' : '') +
      '</div>';

    let listHtml = '';
    if (!items.length) {
      listHtml = '<div class="empty"><h3>' + (total ? '没有符合筛选的病人' : '还没有在院病人') + '</h3>' +
        '<p>' + (total ? '换个筛选或点重置。' : '点右上角「+」录入患者卡片。') + '</p>' +
        (total ? '<button class="btn ghost" data-act="filter-reset">重置筛选</button>' : '') +
        '</div>';
    } else if (app.state.listMode === 'table') {
      const rows = items.map(function (it) {
        const tb = cf.teacher ? teacherBadge(app, it.adm) : '';
        const tg = cf.tags ? tagsHtml(app, it.patient) : '';
        return '<tr data-act="detail" data-id="' + esc(it.adm.id) + '">' +
          '<td class="bed">' + esc(it.adm.bed) + '</td>' +
          '<td class="name"><div class="row" style="gap:6px">' + tb + '<span>' + esc(it.patient.name) + '</span>' +
            '<span class="pc-tags">' + tg + '</span></div></td>' +
          '<td class="diag">' + esc(it.adm.diagnosis || '—') + '</td>' +
          '<td class="surgery">' + esc(surgeryLine(app, it.adm)) + '</td>' +
          '<td class="todo-cell">' + todoBadge(it.task) + '</td>' +
          '</tr>';
      }).join('');
      listHtml = '<div class="table-wrap"><table class="patient-table"><thead><tr>' +
        '<th>床号</th><th>姓名</th><th>主诊断</th><th>手术及日期</th><th>待办</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>';
    } else {
      listHtml = '<div class="cards">' + items.map(function (it) {
        const tb = cf.teacher ? teacherBadge(app, it.adm) : '';
        const tg = cf.tags ? tagsHtml(app, it.patient) : '';
        const bits = [];
        const hasAge = it.patient.age != null && it.patient.age !== '';
        if (cf.sexAge && (it.patient.sex || hasAge)) bits.push((it.patient.sex || '—') + ' ' + (hasAge ? it.patient.age : '—'));
        if (cf.height && it.patient.height != null && it.patient.height !== '') bits.push(it.patient.height + ' cm');
        if (cf.admissionDate && it.adm.admissionDate) bits.push('入院 ' + root.UI.fmtDate(it.adm.admissionDate));
        const meta = bits.length ? '<div class="pc-surgery">' + esc(bits.join(' · ')) + '</div>' : '';
        return '<button class="patient-card" data-act="detail" data-id="' + esc(it.adm.id) + '">' +
          '<div class="pc-top">' +
          '<span class="pc-bed">' + esc(it.adm.bed) + '</span>' + tb +
          '<span class="pc-name">' + esc(it.patient.name) + '</span></div>' +
          '<div class="pc-diag">' + esc(it.adm.diagnosis || '未填主诊断') + '</div>' +
          '<div class="pc-surgery">' + esc(surgeryLine(app, it.adm)) + '</div>' +
          meta +
          '<div class="pc-bottom">' + todayBadges(it.todayTasks) +
          (tg ? '<span class="pc-tags">' + tg + '</span>' : '') + '</div>' +
          '</button>';
      }).join('') + '</div>';
    }

    return '<div class="page-head"><div><h1>患者</h1><div class="sub">在院 ' + stats.inHospital + ' 人 · 今日待办 ' + stats.todayTodo + ' · 逾期 ' + stats.overdue + '</div></div>' +
      '<div class="row"><button class="btn ghost" data-nav="pending">待入院 <span class="badge">' + app.pendingList().length + '</span></button>' +
      '<button class="btn plus" data-act="add-patient" aria-label="新增患者" title="新增患者">+</button></div></div>' +
      '<div class="row between" style="margin-bottom:8px"><div class="seg">' +
      '<button class="' + (app.state.listMode === 'cards' ? 'active' : '') + '" data-act="list-mode" data-value="cards">卡片</button>' +
      '<button class="' + (app.state.listMode === 'table' ? 'active' : '') + '" data-act="list-mode" data-value="table">表格</button></div>' +
      '<span class="small muted">' + items.length + ' / ' + total + ' 人</span></div>' +
      filterBar + listHtml;
  };

  // ---------- 待入院 ----------
  Views.pending = function (app) {
    const list = app.pendingList();
    let body;
    if (!list.length) {
      body = '<div class="empty"><h3>没有待入院草稿</h3><p>值班当天点右上角「+ 新入院」；复核后标记老师、收进组。</p></div>';
    } else {
      body = '<div class="cards single">' + list.map(function (it) {
        return '<div class="patient-card" style="cursor:default">' +
          '<div class="pc-top"><span class="pc-bed">' + esc(it.adm.bed || '未填床号') + '</span>' +
          '<span class="pc-name">' + esc(it.patient.name || '未填姓名') + '</span>' +
          '<span class="pc-status">' + root.UI.statusBadge('pending') + '</span></div>' +
          '<div class="pc-diag">' + esc(it.adm.diagnosis || '未填主诊断') + '</div>' +
          '<div class="pc-surgery">入院 ' + root.UI.fmtDate(it.adm.admissionDate) + ' · 创建 ' + root.UI.fmtDateTime(it.adm.createdAt) + '</div>' +
          '<div class="row" style="margin-top:4px">' +
          '<button class="btn small" data-act="edit-intake" data-id="' + esc(it.adm.id) + '">继续填写</button>' +
          '<button class="btn small primary" data-act="promote" data-id="' + esc(it.adm.id) + '">收进组</button>' +
          '<button class="btn small danger" data-act="delete-admission" data-id="' + esc(it.adm.id) + '">删除</button>' +
          '</div></div>';
      }).join('') + '</div>';
    }
    return '<div class="page-head"><div><h1>待入院</h1><div class="sub">' + list.length + ' 份草稿 · 不计入在院、不生成任务</div></div>' +
      '<button class="btn primary" data-act="new-intake">+ 新入院</button></div>' + body;
  };

  // ---------- 详情 ----------
  Views.detail = function (app) {
    const ctx = app.context(app.state.selectedId);
    if (!ctx) return '<div class="empty"><h3>找不到这个患者</h3><button class="btn" data-nav="list">返回列表</button></div>';
    const adm = ctx.adm;
    const p = ctx.patient;
    const res = ctx.res;
    const intake = adm.intake || {};
    const knee = intake.knee || {};
    const hip = intake.hip || {};
    const ligament = function (v) {
      return { normal: '正常', lax: '松弛', not_examined: '未查' }[v] || '—';
    };
    const bedHistory = (adm.bedHistory || []).map(function (h) {
      return '<div class="history-item"><span class="history-date">' + esc(root.UI.fmtDate(h.date)) + '</span><span>' + esc(h.bed) + '</span><span class="history-note">' + esc(h.note || '') + '</span></div>';
    }).join('');

    const taskRows = ctx.tasks.map(function (t) { return taskRow(app, adm, t); }).join('') ||
      '<div class="faint small">暂无待办；点右上角「+」加一条。</div>';

    const history = res.history.slice(0, 80).map(function (h) {
      return '<div class="history-item">' +
        '<span class="history-date">' + esc(root.UI.fmtDate(h.date)) + '</span>' +
        '<span class="history-main"><b>' + esc(h.label) + '</b> · ' + esc(h.actionLabel) + (h.bySenior ? '（上级）' : '') + '</span>' +
        (h.note ? '<span class="history-note">' + esc(h.note) + '</span>' : '') +
        '<button class="btn small ghost history-edit" data-act="edit-event" data-event="' + esc(h.eventId || h.id) + '">编辑</button>' +
        '</div>';
    }).join('') || '<div class="faint small">暂无记录</div>';

    const patientPhotos = app.attachments('patient', p.id);
    const admissionPhotos = app.attachments('admission', adm.id);

    const backIcon = '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 5l-6 7 6 7"/></svg>';
    const footer = '<div class="detail-footer">' +
      (adm.status === 'pending' ? '<button class="btn primary" data-act="promote" data-id="' + esc(adm.id) + '">收进组</button>' : '') +
      (adm.status === 'admitted' ? '<button class="btn ghost" data-act="discharge" data-id="' + esc(adm.id) + '">出院</button>' : '') +
      (adm.status === 'discharged' ? '<button class="btn good" data-act="restore" data-id="' + esc(adm.id) + '">改回在院</button>' : '') +
      '<button class="btn danger" data-act="delete-admission" data-id="' + esc(adm.id) + '">删除</button>' +
      '</div>';

    return '<div class="detail-back-row">' +
      '<button class="back-icon" data-nav="list" aria-label="返回患者列表" title="返回患者列表">' + backIcon + '</button>' +
      '<div class="detail-title"><span class="bed">' + esc(adm.bed) + '</span><h1>' + esc(p.name) + '</h1>' +
      root.UI.statusBadge(adm.status) + teacherBadge(app, adm) +
      '<span class="pc-tags">' + tagsHtml(app, p) + '</span></div></div>' +
      '<div class="detail-top">' +
      '<section class="card info-card"><div class="card-head"><h2>基本信息</h2>' +
      '<button class="btn small ghost" data-act="edit-admission" data-id="' + esc(adm.id) + '">编辑</button></div>' +
      kv([
        ['性别 / 年龄', esc(p.sex || '—') + ' / ' + (p.age != null && p.age !== '' ? esc(p.age) : '—')],
        ['身高', (p.height != null && p.height !== '' ? esc(p.height) + ' cm' : '—')],
        ['床号', esc(adm.bed)],
        ['入院日期', esc(root.UI.fmtDateFull(adm.admissionDate))],
        ['主诊断', esc(adm.diagnosis || '—')],
        ['手术', esc(adm.surgeryName || '—')],
        ['手术日期', esc(root.UI.fmtDateFull(adm.surgeryDate))],
        ['带教老师', esc(teacherName(app, adm.teacherId))],
        ['状态', esc(adm.status === 'admitted' ? '在院' : (adm.status === 'pending' ? '待入院' : '已出院'))],
        ['备注', p.notes ? '<div class="text-block note-text">' + esc(p.notes) + '</div>' : '—']
      ]) +
      (res.backfilled ? '<div class="small faint" style="margin-top:8px">补录：录入前任务已按默认天数跳过。</div>' : '') +
      (bedHistory ? '<h3 style="margin-top:12px">床位变迁</h3>' + bedHistory : '') +
      '</section>' +
      '<section class="card todo-card"><div class="card-head"><h2>待办 <span class="small muted">' + ctx.tasks.length + ' 项</span></h2>' +
      '<button class="btn plus tiny" data-act="free-todo" data-admission="' + esc(adm.id) + '" aria-label="加待办" title="加待办">+</button></div>' +
      '<div class="task-list">' + taskRows + '</div></section>' +
      '</div>' +
      '<section class="card"><div class="card-head"><h2>任务历史</h2><button class="btn small ghost" data-act="history" data-id="' + esc(adm.id) + '">返工 / 全部</button></div>' +
      '<div class="history detail-history">' + history + '</div></section>' +
      '<section class="card assessment-card"><div class="card-head"><h2>入院评估</h2>' +
      '<button class="btn small ghost" data-act="edit-intake" data-assessment="1" data-id="' + esc(adm.id) + '">编辑</button></div>' +
      (intakeHas(adm) ? (
        '<h3>现病史</h3>' + textBlock(intake.presentIllness) +
        '<h3 style="margin-top:10px">既往史</h3>' + textBlock(intake.pastHistory) +
