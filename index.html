/* 病人管理系统 - 应用状态与交互 */
(function (root) {
  'use strict';

  const Engine = root.Engine;
  const Store = root.Store;
  const UI = root.UI;
  const Views = root.Views;
  const Zip = root.Zip;
  const Xlsx = root.Xlsx;
  const esc = UI.esc;

  const App = {
    state: {
      page: 'overview',
      overviewDay: 'today',
      listMode: 'cards',
      filter: { teacherId: 'all', surgery: 'all', tagIds: [] },
      q: '',
      selectedId: '',
      intake: null,
      intakeReturn: null,
      today: '',
      data: null,
      standalone: false,
      dev: false,
      readOnly: false,
      photoUrls: {},
      photoTarget: null
    },

    // ---------- 初始化 ----------
    async init() {
      this.state.today = Engine.todayYMD();
      this.state.standalone = this.isStandalone();
      this.state.dev = this.isDev();
      this.state.readOnly = !this.state.standalone && !this.state.dev;

      if (this.state.readOnly) {
        this.renderInstall();
        return;
      }

      try {
        this.state.data = await Store.init();
      } catch (err) {
        document.getElementById('app').innerHTML = '<div class="install-wrap"><div class="install-card"><h1>数据库打不开</h1><p>' +
          UI.esc(err.message || String(err)) + '</p><p>请确认没有开启无痕浏览；实在不行先导出备份再重试。</p></div></div>';
        return;
      }

      this.bindGlobal();
      this.render();
      this.registerSW();
      this.tickTimer = setInterval(() => this.checkDay(), 60000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) this.checkDay(); });
    },

    isStandalone() {
      return (root.navigator && root.navigator.standalone === true) ||
        (root.matchMedia && root.matchMedia('(display-mode: standalone)').matches);
    },

    isDev() {
      const q = root.location ? root.location.search : '';
      const h = root.location ? root.location.hostname : '';
      return /(^|[?&])dev=1(&|$)/.test(q) || h === '127.0.0.1' || h === 'localhost';
    },

    registerSW() {
      if (!('serviceWorker' in root.navigator)) return;
      if (!/^https?:$/.test(root.location.protocol)) return;
      root.navigator.serviceWorker.register('./sw.js').catch(() => {});
    },

    checkDay() {
      const t = Engine.todayYMD();
      if (t !== this.state.today) {
        this.state.today = t;
        if (this.state.data) this.reload();
      }
    },

    bindGlobal() {
      if (this._bound) return;
      this._bound = true;

      document.addEventListener('click', (e) => {
        const nav = e.target.closest('[data-nav]');
        if (nav) {
          e.preventDefault();
          this.go(nav.getAttribute('data-nav'));
          return;
        }
        const el = e.target.closest('[data-act]');
        if (!el) return;
        const act = el.getAttribute('data-act');
        this.handleAct(act, el, e);
      });

      let searchTimer = null;
      document.addEventListener('input', (e) => {
        if (e.target && e.target.id === 'search-input') {
          const v = e.target.value;
          clearTimeout(searchTimer);
          searchTimer = setTimeout(() => {
            this.state.q = v;
            this.render();
            const input = document.getElementById('search-input');
            if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
          }, 220);
        }
      });

      document.addEventListener('submit', (e) => {
        if (e.target && e.target.id === 'intake-form') e.preventDefault();
      });

      document.addEventListener('change', (e) => {
        if (e.target && e.target.id === 'free-kind') {
          const kind = e.target.value;
          const title = document.querySelector('#free-form [name="title"]');
          const repeat = document.querySelector('#free-form [name="type"]');
          const interval = document.querySelector('#free-form [name="interval"]');
          if (title && !title.value.trim()) title.value = Engine.COMMON_TASK_LABELS[kind] || '';
          if (repeat) { repeat.value = kind === 'custom' ? repeat.value : 'once'; repeat.disabled = kind !== 'custom'; }
          if (interval) interval.disabled = kind !== 'custom';
        }
      });
    },

    handleAct(act, el, e) {
      const adId = el.getAttribute('data-admission') || el.getAttribute('data-id') || '';
      switch (act) {
        case 'new-intake': this.openIntake(); break;
        case 'edit-intake': this.openIntake(el.getAttribute('data-id'), { assessmentOnly: el.getAttribute('data-assessment') === '1' }); break;
        case 'cancel-intake': this.cancelIntake(); break;
        case 'save-intake': this.saveIntake(el.getAttribute('data-promote') === '1'); break;
        case 'edit-admission': this.openEditAdmission(adId); break;
        case 'save-admission': this.saveAdmission(adId); break;
        case 'add-patient': this.openAddPatient(); break;
        case 'promote': this.openPromote(adId); break;
        case 'discharge': this.discharge(adId); break;
        case 'restore': this.restore(adId); break;
        case 'delete-admission': this.deleteAdmission(adId); break;
        case 'detail': this.go('detail', adId); break;
        case 'tasks': this.openTasks(adId); break;
        case 'task-action': this.doTaskAction(adId, el); break;
        case 'task-plan': this.openTaskPlan(adId, el.getAttribute('data-type')); break;
        case 'free-todo': this.openFreeTodo(el.getAttribute('data-admission') || '', el.getAttribute('data-id') || ''); break;
        case 'save-free': this.saveFreeTodo(adId); break;
        case 'free-complete': this.completeFreeTodo(el.getAttribute('data-id')); break;
        case 'history': this.openHistory(adId); break;
        case 'edit-event': this.openEditEvent(el.getAttribute('data-event') || el.getAttribute('data-id')); break;
        case 'add-photo': this.addPhoto(el.getAttribute('data-owner-type'), el.getAttribute('data-owner-id')); break;
        case 'delete-photo': this.deletePhoto(el.getAttribute('data-id')); break;
        case 'view-photo': this.viewPhoto(el.getAttribute('data-id')); break;
        case 'view-photo-url': this.viewPhotoUrl(el.getAttribute('data-url')); break;
        case 'intake-photo-add': this.intakePhotoAdd(); break;
        case 'intake-photo-remove': this.intakePhotoRemove(Number(el.getAttribute('data-index'))); break;
        case 'posture-chip': {
          const input = document.querySelector('#intake-form [name="hipPosture"]');
          if (input) input.value = el.getAttribute('data-value');
          break;
        }
        case 'filter-teacher':
          this.state.filter.teacherId = el.getAttribute('data-value');
          this.render(); break;
        case 'filter-surgery':
          this.state.filter.surgery = el.getAttribute('data-value');
          this.render(); break;
        case 'filter-tag': {
          const id = el.getAttribute('data-value');
          const arr = this.state.filter.tagIds;
          const i = arr.indexOf(id);
          if (i >= 0) arr.splice(i, 1); else arr.push(id);
          this.render(); break;
        }
        case 'filter-reset':
          this.state.filter = { teacherId: 'all', surgery: 'all', tagIds: [] };
          this.state.q = '';
          this.render(); break;
        case 'list-mode':
          this.state.listMode = el.getAttribute('data-value') === 'table' ? 'table' : 'cards';
          this.render(); break;
        case 'ov-day':
          this.state.overviewDay = el.getAttribute('data-value') === 'tomorrow' ? 'tomorrow' : 'today';
          this.render(); break;
        case 'save-settings': this.saveSettings(); break;
        case 'add-teacher': this.addTeacherRow(); break;
        case 'remove-teacher': this.removeRow(el); break;
        case 'add-tag': this.addTagRow(); break;
        case 'remove-tag': this.removeRow(el); break;
        case 'backup-export': this.exportBackup(); break;
        case 'backup-import': this.importBackup(); break;
        case 'sync-export': this.exportSync(); break;
        case 'sync-import': this.importSync(); break;
        case 'photos-export': this.exportPhotos(); break;
        case 'photos-import': this.importPhotos(); break;
        case 'xlsx-export': this.exportXlsx(); break;
        case 'demo-load': this.seedDemo(); break;
        case 'clear-all': this.clearAll(); break;
        default: break;
      }
    },

    // ---------- 渲染 ----------
    render() {
      if (this.state.readOnly) { this.renderInstall(); return; }
      const app = document.getElementById('app');
      app.innerHTML = this.shell();
      this.hydratePhotos();
    },

    shell() {
      const pending = this.pendingList().length;
      const page = this.state.page;
      const nav = [
        ['overview', '总览'],
        ['list', '患者'],
        ['pending', '待入院'],
        ['settings', '设置']
      ];
      const active = (page === 'detail' || page === 'intake') ? 'list' : page;
      const navHtml = nav.map(function (n) {
        return '<button class="nav-btn ' + (active === n[0] ? 'active' : '') + '" data-nav="' + n[0] + '">' + n[1] +
          (n[0] === 'pending' && pending ? ' <span class="badge">' + pending + '</span>' : '') + '</button>';
      }).join('');

      let content = '';
      if (page === 'overview') content = Views.overview(this);
      else if (page === 'list') content = Views.list(this);
      else if (page === 'pending') content = Views.pending(this);
      else if (page === 'detail') content = Views.detail(this);
      else if (page === 'intake') content = Views.intake(this);
      else if (page === 'settings') content = Views.settings(this);
      else content = Views.overview(this);

      return '<div class="app">' +
        '<header class="topbar"><div class="topbar-inner">' +
        '<div class="brand"><div class="brand-title">病人管理</div><div class="brand-sub">' +
        UI.fmtDate(this.state.today) + ' ' + UI.weekday(this.state.today) + '</div></div>' +
        '<nav class="nav">' + navHtml + '</nav>' +
        '</div></header>' +
        '<main class="page">' + content + '</main>' +
        '<div class="version">' + UI.esc(root.APP_VERSION || 'dev') + ' · 本机数据</div>' +
        '</div>';
    },

    renderInstall() {
      const url = root.location.origin + root.location.pathname;
      document.getElementById('app').innerHTML =
        '<div class="install-wrap"><div class="install-card">' +
        '<h1>先添加到主屏幕</h1>' +
        '<p>这是 iPhone / iPad 主屏 App。Safari 标签页和主屏 App 的数据是隔离的，请先添加，再从图标打开。</p>' +
        '<ol class="install-steps">' +
        '<li>用 <b>Safari</b> 打开下面网址。</li>' +
        '<li>点底部分享按钮。</li>' +
        '<li>选「<b>添加到主屏幕</b>」。</li>' +
        '<li>从主屏图标打开；第一次要联网，之后可离线。</li>' +
        '</ol>' +
        '<div class="install-url">' + UI.esc(url) + '</div>' +
        '<p class="small faint" style="margin-top:14px">在 Mac 上预览：网址后加 <code>?dev=1</code>。</p>' +
        '</div></div>';
    },

    go(page, id) {
      this.state.page = page;
      if (id) this.state.selectedId = id;
      if (page !== 'intake') this.state.intake = null;
      this.render();
      root.scrollTo(0, 0);
    },

    // ---------- 数据查询 ----------
    patient(id) { return (this.state.data.patients || []).find((p) => p.id === id && !p.deletedAt); },
    admission(id) { return (this.state.data.admissions || []).find((a) => a.id === id && !a.deletedAt); },
    admittedList() {
      return (this.state.data.admissions || []).filter((a) => a.status === 'admitted' && !a.deletedAt)
        .sort((a, b) => Engine.compareBed(a.bed, b.bed));
    },
    pendingList() {
      return (this.state.data.admissions || []).filter((a) => a.status === 'pending' && !a.deletedAt)
        .sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')))
        .map((a) => ({ adm: a, patient: this.patient(a.patientId) || { name: '', tags: [] } }));
    },
    dischargedList() {
      return (this.state.data.admissions || []).filter((a) => a.status === 'discharged' && !a.deletedAt)
        .sort((a, b) => Engine.compareBed(a.bed, b.bed))
        .map((a) => ({ adm: a, patient: this.patient(a.patientId) || { name: '', tags: [] } }));
    },
    context(id) {
      const adm = this.admission(id);
      if (!adm) return null;
      const patient = this.patient(adm.patientId) || { name: '', tags: [] };
      const res = Engine.computeAdmission(adm, this.state.data.events, this.state.data.freeTodos, this.state.data.settings, this.state.today);
      const tasks = res.current;
      return {
        adm: adm, patient: patient, res: res, tasks: tasks,
        todayTasks: tasks.filter((t) => t.status === 'pending' || t.status === 'overdue'),
        primary: this.primaryOf(res)
      };
    },
    primaryOf(res) {
      return res.current[0] || null;
    },
    overview() {
      return Engine.buildOverview(this.state.data.admissions, this.state.data.patients,
        this.state.data.events, this.state.data.freeTodos, this.state.data.settings, this.state.today);
    },
    filterCounts() {
      return Engine.filterCounts(this.state.data.admissions, this.state.data.patients, this.state.today);
    },
    filtered() {
      const list = Engine.filterAdmissions(this.state.data.admissions, this.state.data.patients, this.state.filter, this.state.today);
      const q = (this.state.q || '').trim().toLowerCase();
      return list
        .filter((a) => {
          if (!q) return true;
          const p = this.patient(a.patientId) || {};
          return String(p.name || '').toLowerCase().includes(q) ||
            String(a.bed || '').toLowerCase().includes(q) ||
            String(a.diagnosis || '').toLowerCase().includes(q);
        })
        .sort((a, b) => Engine.compareBed(a.bed, b.bed))
        .map((a) => {
          const ctx = this.context(a.id);
          return { adm: a, patient: this.patient(a.patientId) || { name: '', tags: [] }, task: ctx.primary, todayTasks: ctx.todayTasks };
        });
    },
    freeTodosFor(admissionId) {
      return (this.state.data.freeTodos || []).filter((f) => f.admissionId === admissionId && !f.deletedAt && !f.doneAt)
        .sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
    },
    attachments(ownerType, ownerId) {
      return (this.state.data.attachments || []).filter((a) => a.ownerType === ownerType && a.ownerId === ownerId && !a.deletedAt)
        .sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
    },
    teacherName(id) {
      if (!id) return '—';
      const t = (this.state.data.settings.teachers || []).find((x) => x.id === id);
      return t ? t.name : '—';
    },

    // ---------- 新入院 / 补充入院评估 ----------
    openIntake(id, opts) {
      const o = opts || {};
      const existingAdm = id ? this.admission(id) : null;
      if (id && !existingAdm) { UI.toast('找不到这条住院记录'); return; }
      const sourcePage = this.state.page;
      const assessmentOnly = !!(existingAdm && (existingAdm.status === 'admitted' || o.assessmentOnly));
      let draft;
      if (existingAdm) {
        const p = this.patient(existingAdm.patientId) || {};
        draft = {
          admissionId: existingAdm.id,
          patientId: p.id,
          assessmentOnly: assessmentOnly,
          returnPage: sourcePage === 'detail' ? 'detail' : (existingAdm.status === 'pending' ? 'pending' : 'detail'),
          returnId: existingAdm.id,
          patient: { name: p.name || '', sex: p.sex || '', age: p.age != null ? p.age : '', height: p.height != null ? p.height : '' },
          admission: {
            id: existingAdm.id, bed: existingAdm.bed || '', admissionDate: existingAdm.admissionDate || '',
            diagnosis: existingAdm.diagnosis || '', status: existingAdm.status || 'pending'
          },
          intake: JSON.parse(JSON.stringify(existingAdm.intake || {})),
          photos: this.attachments('admission', existingAdm.id).map((a) => ({ id: a.id, existing: true, removed: false }))
        };
      } else {
        draft = {
          admissionId: '', patientId: '',
          assessmentOnly: false,
          returnPage: 'pending',
          returnId: '',
          patient: { name: '', sex: '', age: '', height: '' },
          admission: { bed: '', admissionDate: this.state.today, diagnosis: '', status: 'pending' },
          intake: {
            presentIllness: '', pastHistory: '', recentTests: '', notes: '',
            surgeryHistory: { has: 'no', text: '' },
            traumaHistory: { has: 'no', text: '' },
            allergyHistory: { has: 'no', text: '' },
            knee: { rom1: '', rom2: '', rom3: '', mcl: 'not_examined', lcl: 'not_examined', acl: 'not_examined', pcl: 'not_examined' },
            hip: { strength: '', posture: '' }
          },
          photos: []
        };
      }
      this.state.intake = draft;
      this.state.intakeReturn = { page: draft.returnPage, id: draft.returnId };
      this.state.page = 'intake';
      this.render();
      root.scrollTo(0, 0);
    },

    cancelIntake() {
      const ret = this.state.intakeReturn || { page: 'pending', id: '' };
      this.state.intake = null;
      this.state.intakeReturn = null;
      this.go(ret.page || 'pending', ret.id || undefined);
    },

    readIntakeForm() {
      const form = document.getElementById('intake-form');
      if (!form) return null;
      const fd = new FormData(form);
      const v = (k) => String(fd.get(k) == null ? '' : fd.get(k)).trim();
      const num = (k) => { const s = v(k); return s === '' ? '' : Number(s); };
      return {
        patient: { name: v('name'), sex: v('sex'), age: num('age'), height: num('height') },
        admission: { bed: v('bed'), admissionDate: v('admissionDate'), diagnosis: v('diagnosis') },
        intake: {
          presentIllness: v('presentIllness'),
          pastHistory: v('pastHistory'),
          recentTests: v('recentTests'),
          notes: v('intakeNotes'),
          surgeryHistory: { has: v('surgeryHistoryHas') || 'no', text: v('surgeryHistoryText') },
          traumaHistory: { has: v('traumaHistoryHas') || 'no', text: v('traumaHistoryText') },
          allergyHistory: { has: v('allergyHistoryHas') || 'no', text: v('allergyHistoryText') },
          knee: {
            rom1: num('rom1'), rom2: num('rom2'), rom3: num('rom3'),
            mcl: v('mcl') || 'not_examined', lcl: v('lcl') || 'not_examined',
            acl: v('acl') || 'not_examined', pcl: v('pcl') || 'not_examined'
          },
          hip: { strength: v('hipStrength'), posture: v('hipPosture') }
        }
      };
    },

    readAssessmentForm() {
      const form = document.getElementById('intake-form');
      if (!form) return null;
      const fd = new FormData(form);
      const v = (k) => String(fd.get(k) == null ? '' : fd.get(k)).trim();
      const num = (k) => { const s = v(k); return s === '' ? '' : Number(s); };
      return {
        intake: {
          presentIllness: v('presentIllness'),
          pastHistory: v('pastHistory'),
          recentTests: v('recentTests'),
          notes: v('intakeNotes'),
          surgeryHistory: { has: v('surgeryHistoryHas') || 'no', text: v('surgeryHistoryText') },
          traumaHistory: { has: v('traumaHistoryHas') || 'no', text: v('traumaHistoryText') },
          allergyHistory: { has: v('allergyHistoryHas') || 'no', text: v('allergyHistoryText') },
          knee: {
            rom1: num('rom1'), rom2: num('rom2'), rom3: num('rom3'),
            mcl: v('mcl') || 'not_examined', lcl: v('lcl') || 'not_examined',
            acl: v('acl') || 'not_examined', pcl: v('pcl') || 'not_examined'
          },
          hip: { strength: v('hipStrength'), posture: v('hipPosture') }
        }
      };
    },

    captureIntakeForm() {
      if (!this.state.intake) return;
      if (this.state.intake.assessmentOnly) {
        const a = this.readAssessmentForm();
        if (a) this.state.intake.intake = a.intake;
        return;
      }
      const v = this.readIntakeForm();
      if (!v) return;
      this.state.intake.patient = v.patient;
      this.state.intake.admission = Object.assign({}, this.state.intake.admission, v.admission);
      this.state.intake.intake = v.intake;
    },

    async saveIntakePhotos(admissionId, now) {
      const d = this.state.intake;
      for (const ph of ((d && d.photos) || [])) {
        if (ph.existing && ph.removed) {
          await Store.deleteAttachment(ph.id);
        } else if (!ph.existing && !ph.removed) {
          await Store.putAttachment({
            id: Store.uid(),
            ownerType: 'admission',
            ownerId: admissionId,
            caption: '',
            mime: 'image/jpeg',
            width: ph.width,
            height: ph.height,
            createdAt: now,
            updatedAt: now
          }, ph.full, ph.thumb);
        }
      }
    },

    async saveAssessment() {
      const d = this.state.intake;
      const a = this.readAssessmentForm();
      if (!a) return;
      const adm = d.admissionId ? this.admission(d.admissionId) : null;
      if (!adm) { UI.toast('找不到这条住院记录'); return; }
      const now = Store.nowISO();
      adm.intake = a.intake;
      adm.updatedAt = now;
      await Store.put('admissions', adm);
      await this.saveIntakePhotos(adm.id, now);
      this.state.intake = null;
      this.state.intakeReturn = null;
      this.state.page = 'detail';
      this.state.selectedId = adm.id;
      await this.reload();
      UI.toast('入院评估已保存');
      root.scrollTo(0, 0);
    },

    async saveIntake(promote) {
      const d = this.state.intake;
      if (!d) return;
      if (d.assessmentOnly) { await this.saveAssessment(); return; }
      const v = this.readIntakeForm();
      if (!v) return;
      if (!v.patient.name) { UI.toast('姓名必填'); return; }
      if (promote && (!v.admission.bed || !v.admission.diagnosis)) {
        UI.toast('收进组需要姓名、床号、主诊断'); return;
      }
      const now = Store.nowISO();
      const existingAdm = d.admissionId ? this.admission(d.admissionId) : null;
      const existingPatient = d.patientId ? this.patient(d.patientId) : null;
      const patientId = existingPatient ? existingPatient.id : Store.uid();
      const admissionId = existingAdm ? existingAdm.id : Store.uid();

      const patient = Object.assign({}, existingPatient || {}, {
        id: patientId,
        name: v.patient.name,
        sex: v.patient.sex,
        age: v.patient.age,
        height: v.patient.height,
        tags: (existingPatient && existingPatient.tags) || [],
        notes: (existingPatient && existingPatient.notes) || '',
        createdAt: (existingPatient && existingPatient.createdAt) || now,
        updatedAt: now
      });

      const oldBed = existingAdm ? existingAdm.bed : '';
      const bedHistory = (existingAdm && existingAdm.bedHistory) ? existingAdm.bedHistory.slice() : [];
      if (existingAdm && oldBed !== v.admission.bed) {
        bedHistory.push({ date: this.state.today, bed: v.admission.bed, note: oldBed ? '由 ' + oldBed + ' 调整' : '' });
      }

      const willAdmit = !!(promote || (existingAdm && existingAdm.status === 'admitted'));
      const admission = Object.assign({}, existingAdm || {}, {
        id: admissionId,
        patientId: patientId,
        bed: v.admission.bed,
        admissionDate: v.admission.admissionDate,
        diagnosis: v.admission.diagnosis,
        surgeryName: (existingAdm && existingAdm.surgeryName) || '',
        surgeryDate: (existingAdm && existingAdm.surgeryDate) || '',
        teacherId: (existingAdm && existingAdm.teacherId) || '',
        status: willAdmit ? 'admitted' : 'pending',
        intake: v.intake,
        bedHistory: bedHistory,
        taskStartDate: (existingAdm && existingAdm.taskStartDate) || (willAdmit ? (existingAdm ? (Engine.admissionStartDate(existingAdm) || this.state.today) : this.state.today) : ''),
        taskPlans: (existingAdm && existingAdm.taskPlans) || {},
        createdAt: (existingAdm && existingAdm.createdAt) || now,
        updatedAt: now
      });

      await Store.put('patients', patient);
      await Store.put('admissions', admission);
      await this.saveIntakePhotos(admissionId, now);

      this.state.intake = null;
      const ret = this.state.intakeReturn || {};
      this.state.intakeReturn = null;
      this.state.page = willAdmit ? 'detail' : (ret.page || 'pending');
      this.state.selectedId = admissionId;
      await this.reload();
      UI.toast(promote ? '已收进组' : (willAdmit ? '已保存' : '已保存草稿'));
      root.scrollTo(0, 0);
    },

    // ---------- 编辑住院信息 ----------
    openEditAdmission(id) {
      const adm = this.admission(id);
      if (!adm) return;
      const p = this.patient(adm.patientId) || {};
      const s = this.state.data.settings;
      const tags = (s.tags || []).map((t) => {
        const checked = (p.tags || []).indexOf(t.id) >= 0 ? ' checked' : '';
        return '<label class="check" style="margin-right:10px"><input type="checkbox" name="tags" value="' + UI.esc(t.id) + '"' + checked + '>' + UI.esc(t.label) + '</label>';
      }).join('');
      const teacherOpts = '<option value="">未分配</option>' + (s.teachers || []).map((t) =>
        '<option value="' + UI.esc(t.id) + '"' + (adm.teacherId === t.id ? ' selected' : '') + '>' + UI.esc(t.name) + '</option>').join('');

      const body = '<form id="adm-form">' +
        '<div class="grid2">' +
        '<div class="field"><label>姓名 *</label><input name="name" value="' + UI.esc(p.name || '') + '"></div>' +
        '<div class="field"><label>性别</label><select name="sex"><option value="">未填</option><option value="男"' + (p.sex === '男' ? ' selected' : '') + '>男</option><option value="女"' + (p.sex === '女' ? ' selected' : '') + '>女</option></select></div>' +
        '<div class="field"><label>年龄</label><input name="age" type="number" inputmode="numeric" value="' + UI.esc(p.age != null ? p.age : '') + '"></div>' +
        '<div class="field"><label>身高 cm</label><input name="height" type="number" inputmode="numeric" value="' + UI.esc(p.height != null ? p.height : '') + '"></div>' +
        '<div class="field"><label>床号 *</label><input name="bed" value="' + UI.esc(adm.bed || '') + '"></div>' +
        '<div class="field"><label>入院日期</label><input name="admissionDate" type="date" value="' + UI.esc(adm.admissionDate || '') + '"></div>' +
        '<div class="field" style="grid-column:1/-1"><label>主诊断 *</label><input name="diagnosis" value="' + UI.esc(adm.diagnosis || '') + '"></div>' +
        '<div class="field"><label>手术名称</label><input name="surgeryName" value="' + UI.esc(adm.surgeryName || '') + '"></div>' +
        '<div class="field"><label>手术日期</label><input name="surgeryDate" type="date" value="' + UI.esc(adm.surgeryDate || '') + '"></div>' +
        '<div class="field" style="grid-column:1/-1"><label>备注</label><textarea name="notes" placeholder="如 糖尿病、抗凝药、家属联系方式…">' + UI.esc(p.notes || '') + '</textarea></div>' +
        '<div class="field" style="grid-column:1/-1"><label>带教老师</label><select name="teacherId">' + teacherOpts + '</select></div>' +
        '<div class="field" style="grid-column:1/-1"><label>标签</label><div class="row">' + (tags || '<span class="faint small">设置里先添加标签</span>') + '</div></div>' +
        '</div></form>';

      const self = this;
      UI.modal({
        title: '编辑住院信息',
        body: body,
        actions: [
          { label: '取消', className: 'ghost' },
          {
            label: '保存', className: 'primary', onClick: async function (close) {
              const ok = await self.saveAdmission(id);
              if (ok) close();
            }
          }
        ]
      });
    },

    async saveAdmission(id) {
      const form = document.getElementById('adm-form');
      if (!form) return false;
      const fd = new FormData(form);
      const v = (k) => String(fd.get(k) == null ? '' : fd.get(k)).trim();
      if (!v('name')) { UI.toast('姓名必填'); return false; }
      const adm = this.admission(id);
      if (!adm) return false;
      const p = this.patient(adm.patientId) || {};
      const now = Store.nowISO();
      const oldBed = adm.bed;
      const bedHistory = (adm.bedHistory || []).slice();
      if (oldBed !== v('bed')) bedHistory.push({ date: this.state.today, bed: v('bed'), note: oldBed ? '由 ' + oldBed + ' 调整' : '' });

      const patient = Object.assign({}, p, {
        id: p.id,
        name: v('name'),
        sex: v('sex'),
        age: v('age') === '' ? '' : Number(v('age')),
        height: v('height') === '' ? '' : Number(v('height')),
        tags: fd.getAll('tags'),
        notes: v('notes'),
        updatedAt: now
      });
      const admission = Object.assign({}, adm, {
        bed: v('bed'),
        admissionDate: v('admissionDate'),
        diagnosis: v('diagnosis'),
        surgeryName: v('surgeryName'),
        surgeryDate: v('surgeryDate'),
        teacherId: v('teacherId'),
        bedHistory: bedHistory,
        updatedAt: now
      });
      await Store.put('patients', patient);
      await Store.put('admissions', admission);
      await this.reload();
      UI.toast('已保存');
      return true;
    },

    // ---------- 患者卡片（直接进患者栏，不写病史模板） ----------
    admissionFormHtml(p, adm) {
      const s = this.state.data.settings;
      const a = adm || {};
      const tags = (s.tags || []).map(function (t) {
        const checked = (p.tags || []).indexOf(t.id) >= 0 ? ' checked' : '';
        return '<label class="check" style="margin-right:10px"><input type="checkbox" name="tags" value="' + UI.esc(t.id) + '"' + checked + '>' + UI.esc(t.label) + '</label>';
      }).join('');
      const teacherOpts = '<option value="">未分配</option>' + (s.teachers || []).map(function (t) {
        return '<option value="' + UI.esc(t.id) + '"' + (a.teacherId === t.id ? ' selected' : '') + '>' + UI.esc(t.name) + '</option>';
      }).join('');

      return '<form id="adm-form">' +
        '<div class="grid2">' +
        '<div class="field"><label>姓名 *</label><input name="name" value="' + UI.esc(p.name || '') + '"></div>' +
        '<div class="field"><label>性别</label><select name="sex"><option value="">未填</option><option value="男"' + (p.sex === '男' ? ' selected' : '') + '>男</option><option value="女"' + (p.sex === '女' ? ' selected' : '') + '>女</option></select></div>' +
        '<div class="field"><label>年龄</label><input name="age" type="number" inputmode="numeric" value="' + UI.esc(p.age != null ? p.age : '') + '"></div>' +
        '<div class="field"><label>身高 cm</label><input name="height" type="number" inputmode="numeric" value="' + UI.esc(p.height != null ? p.height : '') + '"></div>' +
        '<div class="field"><label>床号 *</label><input name="bed" value="' + UI.esc(a.bed || '') + '"></div>' +
        '<div class="field"><label>入院日期</label><input name="admissionDate" type="date" value="' + UI.esc(a.admissionDate || '') + '"></div>' +
        '<div class="field" style="grid-column:1/-1"><label>主诊断</label><input name="diagnosis" value="' + UI.esc(a.diagnosis || '') + '"></div>' +
        '<div class="field"><label>手术名称</label><input name="surgeryName" value="' + UI.esc(a.surgeryName || '') + '"></div>' +
        '<div class="field"><label>手术日期</label><input name="surgeryDate" type="date" value="' + UI.esc(a.surgeryDate || '') + '"></div>' +
        '<div class="field" style="grid-column:1/-1"><label>备注</label><textarea name="notes" placeholder="如 糖尿病、抗凝药、家属联系方式…">' + UI.esc(p.notes || '') + '</textarea></div>' +
        '<div class="field" style="grid-column:1/-1"><label>带教老师</label><select name="teacherId">' + teacherOpts + '</select></div>' +
        '<div class="field" style="grid-column:1/-1"><label>标签</label><div class="row">' + (tags || '<span class="faint small">设置里先添加标签</span>') + '</div></div>' +
        '</div></form>';
    },

    openAddPatient() {
      const p = {};
      const adm = {
        bed: '', admissionDate: this.state.today, diagnosis: '',
        surgeryName: '', surgeryDate: '', teacherId: ''
      };
      const self = this;
      UI.modal({
        title: '新增患者',
        body: this.admissionFormHtml(p, adm),
        actions: [
          { label: '取消', className: 'ghost' },
          {
            label: '保存', className: 'primary', onClick: async function (close) {
              const ok = await self.saveNewPatient();
              if (ok) close();
            }
          }
        ]
      });
    },

    async saveNewPatient() {
      const form = document.getElementById('adm-form');
      if (!form) return false;
      const fd = new FormData(form);
      const v = (k) => String(fd.get(k) == null ? '' : fd.get(k)).trim();
      if (!v('name')) { UI.toast('姓名必填'); return false; }
      if (!v('bed')) { UI.toast('床号必填'); return false; }
      const now = Store.nowISO();
      const patientId = Store.uid();
      const admissionId = Store.uid();
      const patient = {
        id: patientId,
        name: v('name'),
        sex: v('sex'),
        age: v('age') === '' ? '' : Number(v('age')),
        height: v('height') === '' ? '' : Number(v('height')),
        tags: fd.getAll('tags'),
        notes: v('notes'),
        createdAt: now,
        updatedAt: now
      };
      const admission = {
        id: admissionId,
        patientId: patientId,
        bed: v('bed'),
        admissionDate: v('admissionDate'),
        diagnosis: v('diagnosis'),
        surgeryName: v('surgeryName'),
        surgeryDate: v('surgeryDate'),
        teacherId: v('teacherId'),
        status: 'admitted',
        intake: {},
        taskStartDate: this.state.today,
        taskPlans: {},
        bedHistory: [],
        createdAt: now,
        updatedAt: now
      };
      await Store.put('patients', patient);
      await Store.put('admissions', admission);
      await this.reload();
      UI.toast('已添加患者');
      this.go('detail', admissionId);
      return true;
    },

    // ---------- 待入院 / 收进组 ----------
    openPromote(id) {
      const adm = this.admission(id);
      if (!adm) return;
      const p = this.patient(adm.patientId) || {};
      if (!p.name || !adm.bed || !adm.diagnosis) {
        UI.toast('先补姓名、床号、主诊断');
        this.openIntake(id);
        return;
      }
      const s = this.state.data.settings;
      const teachers = s.teachers || [];
      if (!teachers.length) { UI.toast('先在设置里添加带教老师'); return; }
      const current = adm.teacherId || teachers[0].id;
      const opts = teachers.map(function (t) {
        return '<option value="' + UI.esc(t.id) + '"' + (current === t.id ? ' selected' : '') + '>' + UI.esc(t.name) + '</option>';
      }).join('');
      const body = '<p class="small muted">把 <b>' + UI.esc(p.name) + '</b>（' + UI.esc(adm.bed) + '）收进哪个老师的组？</p>' +
        '<div class="field"><label>带教老师 *</label><select id="promote-teacher">' + opts + '</select></div>';
      const self = this;
      UI.modal({
        title: '收进组',
        body: body,
        actions: [
          { label: '取消', className: 'ghost' },
          {
            label: '收进组', className: 'primary', onClick: async function (close) {
              const sel = document.getElementById('promote-teacher');
              const tid = sel ? sel.value : '';
              if (!tid) { UI.toast('先选带教老师'); return; }
              const ok = await self.promote(id, tid);
              if (ok) close();
            }
          }
        ]
      });
    },

    async promote(id, teacherId) {
      const adm = this.admission(id);
      if (!adm) return false;
      const p = this.patient(adm.patientId) || {};
      if (!p.name || !adm.bed || !adm.diagnosis) {
        UI.toast('先补姓名、床号、主诊断');
        this.openIntake(id);
        return false;
      }
      if (!teacherId) { this.openPromote(id); return false; }
      adm.teacherId = teacherId;
      adm.status = 'admitted';
      adm.taskStartDate = this.state.today;
      adm.taskPlans = adm.taskPlans || {};
      adm.updatedAt = Store.nowISO();
      await Store.put('admissions', adm);
      await this.reload();
      UI.toast('已收进组，任务开始');
      this.go('detail', id);
      return true;
    },

    async discharge(id) {
      const adm = this.admission(id);
      if (!adm) return;
      const ok = await UI.confirm('确定出院？任务会停止，历史保留，可再改回在院。', { okLabel: '出院' });
      if (!ok) return;
      const old = adm.status;
      adm.status = 'discharged';
      adm.updatedAt = Store.nowISO();
      await Store.put('admissions', adm);
      await this.reload();
      UI.toast('已出院', async () => {
        adm.status = old;
        adm.updatedAt = Store.nowISO();
        await Store.put('admissions', adm);
        await this.reload();
      });
    },

    async restore(id) {
      const adm = this.admission(id);
      if (!adm) return;
      adm.status = 'admitted';
      adm.updatedAt = Store.nowISO();
      await Store.put('admissions', adm);
      await this.reload();
      UI.toast('已改回在院');
    },

    async deleteAdmission(id) {
      const adm = this.admission(id);
      if (!adm) return;
      const ok = await UI.confirm('删除这条住院记录？删除后 5 秒内可撤销。', { okLabel: '删除', danger: true });
      if (!ok) return;
      const now = Store.nowISO();
      adm.deletedAt = now;
      adm.updatedAt = now;
      await Store.put('admissions', adm);
      await this.reload();
      UI.toast('已删除', async () => {
        adm.deletedAt = '';
        adm.updatedAt = Store.nowISO();
        await Store.put('admissions', adm);
        await this.reload();
      });
    },

    // ---------- 任务动作 ----------
    openTasks(admissionId) {
      const ctx = this.context(admissionId);
      if (!ctx) { UI.toast('找不到患者'); return; }
      const actionable = ctx.tasks.filter((t) => t.status === 'pending' || t.status === 'overdue' || t.status === 'upcoming');
      if (!actionable.length) { UI.toast('没有可处理的任务'); return; }
      const self = this;
      const body = '<div class="grid2">' +
        '<div class="field"><label>操作日期（补录可改）</label><input id="task-date" type="date" value="' + UI.esc(this.state.today) + '"></div>' +
        '<div class="field"><label>备注（可选）</label><input id="task-note" placeholder="如上级姓名 / 渗血"></div>' +
        '</div><div class="tasks" style="margin-top:12px">' +
        actionable.map(function (t) {
          const buttons = t.actions.map(function (a) {
            const labels = { done: '已完成', defer: '明天再做', senior: '上级处理', not_needed: '不再需要' };
            return '<button class="btn small" data-act="task-action" data-admission="' + UI.esc(admissionId) + '" data-type="' + UI.esc(t.type) + '" data-action="' + a + '">' + labels[a] + '</button>';
          }).join('') + ((t.type === 'dressing' || t.kind === 'dressing')
            ? '<button class="btn small ghost" data-act="task-action" data-admission="' + UI.esc(admissionId) + '" data-type="' + UI.esc(t.type) + '" data-action="nonplanned">非计划换药</button>'
            : '');
          return '<div class="task-card ' + t.status + '"><div><div class="task-name">' + UI.esc(t.label) + '</div>' +
            '<div class="task-due">' + UI.esc(t.relative || (t.status === 'overdue' ? '逾期 ' + t.overdueDays + ' 天' : '今天')) +
            (t.dueDate ? ' · ' + UI.fmtDate(t.dueDate) : '') + '</div></div>' +
            '<div class="task-actions">' + buttons + '</div></div>';
        }).join('') + '</div>' +
        '<div style="margin-top:10px"><button class="btn small ghost" data-act="history" data-id="' + UI.esc(admissionId) + '">编辑任务历史</button></div>';

      UI.sheet({ title: '处理待办 · ' + ctx.adm.bed + ' ' + ctx.patient.name, body: body, actions: [{ label: '关闭', className: 'ghost' }] });
    },

    openTaskPlan(admissionId, type) {
      const ctx = this.context(admissionId);
      if (!ctx) { UI.toast('找不到患者'); return; }
      const task = ctx.res.tasks.find((t) => t.type === type);
      if (!task) { UI.toast('找不到这个任务'); return; }
      const adm = ctx.adm;
      const plan = adm.taskPlans && adm.taskPlans[type] ? adm.taskPlans[type] : null;
      const due = task.dueDate || this.state.today;
      const interval = plan && plan.interval ? plan.interval : (task.interval || 1);
      const repeatable = task.type === 'dressing' || task.type.indexOf('free:') === 0;
      const self = this;
      const body = '<form id="task-plan-form">' +
        '<p class="small muted">「' + UI.esc(task.label) + '」只对 <b>' + UI.esc(ctx.patient.name || '') + '</b> 这位患者生效。</p>' +
        '<div class="grid2">' +
        '<div class="field"><label>下一次日期</label><input id="plan-due" type="date" value="' + UI.esc(due) + '"></div>' +
        '<div class="field"><label>循环天数' + (repeatable ? '' : '（本任务不用）') + '</label><input id="plan-interval" type="number" min="1" inputmode="numeric" value="' + UI.esc(interval) + '"></div>' +
        '</div><p class="small faint">循环天数只对这个患者生效；换药完成后会从完成日按这个间隔继续排。</p>' +
        '</form>';
      UI.modal({
        title: '调整下一次 · ' + task.label,
        body: body,
        actions: [
          { label: '取消', className: 'ghost' },
          {
            label: '恢复默认', className: 'ghost', onClick: async function (close) {
              if (adm.taskPlans) delete adm.taskPlans[type];
              adm.updatedAt = Store.nowISO();
              await Store.put('admissions', adm);
              await self.reload();
              close();
              UI.toast('已恢复默认排期');
            }
          },
          {
            label: '保存', className: 'primary', onClick: async function (close) {
              const dateEl = document.getElementById('plan-due');
              const intEl = document.getElementById('plan-interval');
              const next = dateEl ? dateEl.value : '';
              const n = intEl ? Number(intEl.value) : 0;
              if (!Engine.validDate(next)) { UI.toast('先选下一次日期'); return; }
              if (!n || n < 1) { UI.toast('循环天数至少 1 天'); return; }
              adm.taskPlans = adm.taskPlans || {};
              adm.taskPlans[type] = { dueDate: next, interval: n, setAt: Store.nowISO() };
              adm.updatedAt = Store.nowISO();
              await Store.put('admissions', adm);
              await self.reload();
              close();
              UI.toast('已调整排期');
            }
          }
        ]
      });
    },

    async doTaskAction(admissionId, el) {
      const type = el.getAttribute('data-type');
      const action = el.getAttribute('data-action');
      const dateEl = document.getElementById('task-date');
      const noteEl = document.getElementById('task-note');
      const date = (dateEl && dateEl.value) || this.state.today;
      const note = (noteEl && noteEl.value) || '';
      const sheet = document.querySelector('.sheet-backdrop');
      if (sheet) sheet.remove();
      await this.recordAction(admissionId, type, action, date, note);
    },

    async recordAction(admissionId, taskType, action, date, note) {
      const ctx = this.context(admissionId);
      const task = ctx ? ctx.res.tasks.find((t) => t.type === taskType) : null;
      const free = task && task.freeTodoId ? (this.state.data.freeTodos || []).find((x) => x.id === task.freeTodoId) : null;
      const coreType = task && task.kind && task.kind !== 'custom' &&
        (action === 'done' || action === 'senior' || action === 'nonplanned') ? task.kind : '';
      const now = Store.nowISO();
      const ev = {
        id: Store.uid(),
        admissionId: admissionId,
        taskType: coreType || taskType,
        action: action,
        date: date || this.state.today,
        note: note || '',
        sourceFreeTodoId: free ? free.id : '',
        createdAt: now,
        updatedAt: now
      };
      await Store.put('events', ev);
      if (free && (coreType || action === 'not_needed')) {
        free.doneAt = now;
        free.updatedAt = now;
        await Store.put('freeTodos', free);
      }
      await this.reload();
      const labels = { done: '已完成', defer: '明天再做', senior: '上级处理', not_needed: '不再需要', nonplanned: '非计划换药' };
      UI.toast('已记录：' + (labels[action] || action), async () => {
        ev.deletedAt = Store.nowISO();
        ev.updatedAt = ev.deletedAt;
        await Store.put('events', ev);
        if (free && (coreType || action === 'not_needed')) {
          free.doneAt = '';
          free.updatedAt = Store.nowISO();
          await Store.put('freeTodos', free);
        }
        await this.reload();
      });
    },

    // ---------- 自由待办 ----------
    openFreeTodo(admissionId, id) {
      const f = id ? (this.state.data.freeTodos || []).find((x) => x.id === id) : null;
      const anchorId = f ? (f.admissionId || '') : (admissionId || '');
      const kind = f && f.kind ? f.kind : 'custom';
      const kindOpts = [['dressing', '换药'], ['stitch', '拆线'], ['preop', '备术'], ['drain', '拔管'], ['custom', '自定义']]
        .map(function (pair) {
          return '<option value="' + pair[0] + '"' + (kind === pair[0] ? ' selected' : '') + '>' + pair[1] + '</option>';
        }).join('');
      const anchorOpts = '<option value="">不锚定（只在总览显示）</option>' + this.admittedList().map((a) => {
        const p = this.patient(a.patientId) || {};
        return '<option value="' + UI.esc(a.id) + '"' + (anchorId === a.id ? ' selected' : '') + '>' +
          UI.esc((a.bed || '') + ' ' + (p.name || '')) + '</option>';
      }).join('');
      const type = f && f.type === 'repeat' ? 'repeat' : 'once';
      const body = '<form id="free-form">' +
        '<div class="field"><label>常用任务</label><select id="free-kind" name="kind">' + kindOpts + '</select></div>' +
        '<div class="field"><label>标题 *</label><input name="title" value="' + UI.esc(f ? f.title : '') + '" placeholder="如 复查血常规 / 联系家属签字"></div>' +
        '<div class="field"><label>锚定患者</label><select name="admissionId">' + anchorOpts + '</select></div>' +
        '<div class="grid2">' +
        '<div class="field"><label>类型</label><select name="type"' + (kind !== 'custom' ? ' disabled' : '') + '><option value="once"' + (type === 'once' ? ' selected' : '') + '>一次</option><option value="repeat"' + (type === 'repeat' ? ' selected' : '') + '>重复</option></select></div>' +
        '<div class="field"><label>循环天数（重复用）</label><input name="interval" type="number" min="1" inputmode="numeric" value="' + UI.esc(f && f.interval ? f.interval : 2) + '"' + (kind !== 'custom' ? ' disabled' : '') + '></div>' +
        '<div class="field"><label>计划日期</label><input name="dueDate" type="date" value="' + UI.esc(f ? (f.dueDate || '') : this.state.today) + '"></div>' +
        '</div>' +
        '<div class="field"><label>备注</label><input name="note" value="' + UI.esc(f ? f.note || '' : '') + '"></div>' +
        '<p class="small muted" style="margin:10px 0 0">常用任务会进入该患者的任务历史；换药在计划外完成时会刷新下一次换药日期。不锚定患者时只在总览显示。</p>' +
        '</form>';
      const self = this;
      const actions = [
        { label: '取消', className: 'ghost' },
        {
          label: '保存', className: 'primary', onClick: async function (close) {
            const ok = await self.saveFreeTodo(admissionId, f ? f.id : '');
            if (ok) close();
          }
        }
      ];
      if (f && !f.admissionId && !f.doneAt) {
        actions.splice(1, 0, {
          label: '标记完成', className: 'good', onClick: async function (close) {
            await self.completeFreeTodo(f.id);
            close();
          }
        });
      }
      UI.modal({ title: f ? '编辑待办' : '加自由待办', body: body, actions: actions });
    },

    async saveFreeTodo(admissionId, id) {
      const form = document.getElementById('free-form');
      if (!form) return false;
      const fd = new FormData(form);
      const v = (k) => String(fd.get(k) == null ? '' : fd.get(k)).trim();
      const anchorId = v('admissionId');
      const anchor = anchorId ? this.admission(anchorId) : null;
      const kind = v('kind') || 'custom';
      if (kind !== 'custom' && !anchor) { UI.toast('常用任务要先选一位患者'); return false; }
      const title = v('title') || Engine.COMMON_TASK_LABELS[kind] || '';
      if (!title) { UI.toast('标题必填'); return false; }
      const now = Store.nowISO();
      const old = id ? (this.state.data.freeTodos || []).find((x) => x.id === id) : null;
      const isCommon = kind !== 'custom';
      const f = Object.assign({}, old || {}, {
        id: old ? old.id : Store.uid(),
        admissionId: anchor ? anchor.id : '',
        patientId: anchor ? anchor.patientId : '',
        title: title,
        kind: kind,
        type: isCommon ? 'once' : (fd.get('type') === 'repeat' ? 'repeat' : 'once'),
        interval: isCommon ? 1 : Number(fd.get('interval') || 2),
        dueDate: v('dueDate') || this.state.today,
        note: v('note'),
        createdAt: (old && old.createdAt) || now,
        updatedAt: now
      });
      await Store.put('freeTodos', f);
      await this.reload();
      UI.toast('已保存待办');
      return true;
    },

    async completeFreeTodo(id) {
      const f = (this.state.data.freeTodos || []).find((x) => x.id === id);
      if (!f) return;
      const now = Store.nowISO();
      const doneDate = Engine.localDateFromISO(now) || this.state.today;
      f.doneAt = now;
      if (f.type === 'repeat') f.dueDate = Engine.addDays(doneDate, Number(f.interval || 2));
      f.updatedAt = now;
      await Store.put('freeTodos', f);
      await this.reload();
      UI.toast('已完成');
    },

    // ---------- 任务历史 / 返工 ----------
    historyRowHtml(h) {
      return '<div class="history-item">' +
        '<span class="history-date">' + esc(UI.fmtDate(h.date)) + '</span>' +
        '<span class="history-main"><b>' + esc(h.label) + '</b> · ' + esc(h.actionLabel) + (h.bySenior ? '（上级）' : '') + '</span>' +
        (h.note ? '<span class="history-note">' + esc(h.note) + '</span>' : '') +
        '<button class="btn small ghost history-edit" data-act="edit-event" data-event="' + esc(h.eventId || h.id) + '">编辑</button>' +
        '</div>';
    },

    openHistory(admissionId) {
      const all = !admissionId;
      const list = all ? this.admittedList() : [this.admission(admissionId)].filter(Boolean);
      let body = '';
      list.forEach((adm) => {
        const ctx = this.context(adm.id);
        if (!ctx) return;
        const rows = ctx.res.history.map((h) => this.historyRowHtml(h)).join('') || '<div class="faint small">暂无记录</div>';
        body += '<section class="history-group"><div class="history-group-head"><b>' + esc(adm.bed || '') + ' ' + esc(ctx.patient.name || '') + '</b>' +
          '<span class="faint small">' + esc(adm.diagnosis || '') + '</span></div>' + rows + '</section>';
      });
      if (!body) body = '<div class="faint small">还没有任务历史。完成一次任务后会出现记录，可在这里改日期、改动作或删除。</div>';
      UI.sheet({
        title: all ? '任务历史 · 全部在院' : '任务历史 · 返工',
        body: '<p class="small muted">修改日期/动作或删除记录后，排期会立即重算；换药序号也会重新编号。</p>' + body,
        actions: [{ label: '关闭', className: 'ghost' }]
      });
    },

    openEditEvent(eventId) {
      const ev = (this.state.data.events || []).find((x) => x.id === eventId && !x.deletedAt);
      if (!ev) { UI.toast('找不到这条历史'); return; }
      const adm = this.admission(ev.admissionId);
      if (!adm) { UI.toast('找不到这条住院记录'); return; }
      const ctx = this.context(adm.id);
      const item = ctx ? ctx.res.history.find((h) => (h.eventId || h.id) === ev.id) : null;
      document.querySelectorAll('.sheet-backdrop').forEach((x) => x.remove());
      const opts = ['done', 'senior', 'nonplanned', 'defer', 'not_needed'].map((a) =>
        '<option value="' + a + '"' + (ev.action === a ? ' selected' : '') + '>' + UI.esc(Engine.ACTION_LABELS[a] || a) + '</option>').join('');
      const body = '<form id="event-form">' +

              if (!ok) return;
              ev.deletedAt = Store.nowISO();
              ev.updatedAt = ev.deletedAt;
              await Store.put('events', ev);
              if (ev.sourceFreeTodoId) {
                const src = (self.state.data.freeTodos || []).find((x) => x.id === ev.sourceFreeTodoId);
                if (src) {
                  src.doneAt = '';

              close();
              UI.toast('历史已删除');

              const a = document.getElementById('event-action');

              ev.action = a ? a.value : ev.action;
              ev.note = n ? n.value.trim() : '';
              ev.updatedAt = Store.nowISO();
              await Store.put('events', ev);
              if (ev.sourceFreeTodoId) {
                const src = (self.state.data.freeTodos || []).find((x) => x.id === ev.sourceFreeTodoId);
                if (src) {
                  const terminal = ev.action === 'done' || ev.action === 'senior' || ev.action === 'nonplanned';
                  src.doneAt = terminal ? Store.nowISO() : '';
                  src.updatedAt = Store.nowISO();
                  await Store.put('freeTodos', src);
                }
              }
              await self.reload();
              close();
              UI.toast('历史已修正');
            }
          }
        ]
      });

    // ---------- 照片 ----------
    async pickFiles(accept, multiple) {
      return new Promise((resolve) => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = accept || 'image/*';
        input.multiple = !!multiple;
        input.style.display = 'none';
        input.addEventListener('change', () => {
          const files = Array.from(input.files || []);
          input.remove();
          resolve(files);
        });
        document.body.appendChild(input);
        input.click();
      });
    },

    async addPhoto(ownerType, ownerId) {
      if (!ownerType || !ownerId) return;
      const files = await this.pickFiles('image/*', true);
      if (!files.length) return;
      const now = Store.nowISO();
      for (const file of files) {
        try {
          const img = await UI.compressImage(file, 1600, 0.7);
          await Store.putAttachment({
            id: Store.uid(),
            ownerType: ownerType,
            ownerId: ownerId,
            caption: '',
            mime: 'image/jpeg',
            width: img.width,
            height: img.height,
            createdAt: now,
            updatedAt: now
          }, img.full, img.thumb);
        } catch (err) {
          UI.toast('有一张照片处理失败');
        }
      }
      await this.reload();
      UI.toast('已添加照片');
    },

    async intakePhotoAdd() {
      this.captureIntakeForm();
      const files = await this.pickFiles('image/*', true);
      if (!files.length) return;
      for (const file of files) {
        try {
          const img = await UI.compressImage(file, 1600, 0.7);
          this.state.intake.photos.push({
            tempId: Store.uid(),
            full: img.full,
            thumb: img.thumb,
            width: img.width,
            height: img.height,
            url: URL.createObjectURL(img.thumb || img.full),
            removed: false
          });
        } catch (err) {
          UI.toast('有一张照片处理失败');
        }
      }
      this.render();
    },

    intakePhotoRemove(index) {
      this.captureIntakeForm();
      const p = this.state.intake.photos[index];
      if (!p) return;
      if (p.existing) p.removed = true;
      else {
        if (p.url) URL.revokeObjectURL(p.url);
        this.state.intake.photos.splice(index, 1);
      }
      this.render();
    },

    async hydratePhotos() {
      const imgs = Array.from(document.querySelectorAll('img[data-photo]'));
      for (const img of imgs) {
        const id = img.getAttribute('data-photo');
        if (!id) continue;
        if (this.state.photoUrls[id]) { img.src = this.state.photoUrls[id]; continue; }
        try {
          const blob = await Store.getBlob(id);
          if (!blob) continue;
          const url = URL.createObjectURL(blob.thumb || blob.full);
          this.state.photoUrls[id] = url;
          img.src = url;
        } catch (e) { /* ignore */ }
      }
    },

    async viewPhoto(id) {
      const blob = await Store.getBlob(id);
      if (!blob) { UI.toast('照片不存在'); return; }
      const url = URL.createObjectURL(blob.full);
      UI.modal({
        title: '照片',
        body: '<img src="' + url + '" style="width:100%;border-radius:12px;display:block" alt="">',
        actions: [{ label: '关闭', className: 'ghost' }],
        onClose: () => URL.revokeObjectURL(url)

    async importBackup() {
      const files = await this.pickFiles('application/json,.json', false);
      if (!files.length) return;
      try {
        const text = await UI.readFile(files[0], 'text');
        const data = JSON.parse(text);
        if (!data.patients || !data.admissions) throw new Error('不是有效的备份文件');
        const ok = await UI.confirm('恢复会覆盖当前全部业务数据（照片不在 JSON 备份里）。确定？', { okLabel: '覆盖恢复', danger: true });
        if (!ok) return;

        await Store.saveMeta(this.state.data.meta);
        await this.reload();

      } catch (err) {

      }

    async buildPhotoEntries(attachments) {
      const files = [];
      const manifest = [];
      for (const att of attachments) {
        if (!att || att.deletedAt) continue;
        const blob = await Store.getBlob(att.id);
        if (!blob || !blob.full) continue;
        files.push({ name: 'photos/' + att.id + '.jpg', data: new Uint8Array(await blob.full.arrayBuffer()) });
        if (blob.thumb) files.push({ name: 'thumbs/' + att.id + '.jpg', data: new Uint8Array(await blob.thumb.arrayBuffer()) });
        manifest.push(att);
      }
      return { files, manifest };
    },

    async exportSync() {
      const data = Store.exportData(this.state.data);
      const attachments = (this.state.data.attachments || []).filter((a) => !a.deletedAt);
      const photos = await this.buildPhotoEntries(attachments);
      const manifest = { app: 'patient-manager', exportedAt: data.exportedAt, attachments: photos.manifest };
      const files = [{ name: 'data.json', data: JSON.stringify(data) }].concat(photos.files);
      files.push({ name: 'manifest.json', data: JSON.stringify(manifest) });
      const bytes = Zip.create(files);
      UI.download('病人管理-同步-' + this.state.today + '.zip', new Blob([bytes], { type: 'application/zip' }));
      this.state.data.meta.lastSyncAt = data.exportedAt;
      this.state.data.meta.lastExportAt = data.exportedAt;
      await Store.saveMeta(this.state.data.meta);
      this.render();
      UI.toast('同步包已导出（数据 + ' + photos.manifest.length + ' 张照片）');
    },

    async importSync(file) {
      let f = file;
      if (!f) {
        const picked = await this.pickFiles('application/zip,.zip', false);
        if (!picked.length) return;
        f = picked[0];
      }
      try {
        const buf = await UI.readFile(f, 'arrayBuffer');
        const entries = Zip.read(new Uint8Array(buf));
        const dataEntry = entries.find((e) => e.name === 'data.json');
        if (!dataEntry) throw new Error('同步包里没有 data.json');
        const remote = JSON.parse(Zip.text(dataEntry));
        if (remote.exportedAt && this.state.data.meta.lastSyncAt && remote.exportedAt < this.state.data.meta.lastSyncAt) {
          const ok = await UI.confirm('这个同步包比上次同步还旧，导入可能让数据回退。仍然继续？', { okLabel: '继续', danger: true });
          if (!ok) return;
        }
        const merge = Engine.mergeData(this.state.data, remote);
        const manifestEntry = entries.find((e) => e.name === 'manifest.json');
        const manifest = manifestEntry ? JSON.parse(Zip.text(manifestEntry)) : { attachments: [] };
        const remoteAtts = manifest.attachments || [];
        const localAtts = (this.state.data.attachments || []).filter((a) => !a.deletedAt);
        const photoMerge = Engine.mergePhotos(localAtts, remoteAtts);
        const s = merge.summary;

        const conflictHtml = merge.conflicts.length
          ? '<h3 style="margin-top:10px">冲突</h3>' + merge.conflicts.slice(0, 20).map(function (c, i) {
            const title = c.remote.name || c.remote.bed || c.remote.title || c.remote.id;
            return '<div class="list-row"><span class="small">' + UI.esc(c.label + ' · ' + title) + '</span>' +
              '<select data-conflict="' + i + '"><option value="local">用本机</option><option value="remote">用文件</option></select></div>';
          }).join('')
          : '';

        const body = '<div class="text-block">' +
          '患者：新增 ' + s.patients.added + ' / 更新 ' + s.patients.updated + ' / 本机较新 ' + s.patients.localWins + '\n' +
          '住院：新增 ' + s.admissions.added + ' / 更新 ' + s.admissions.updated + ' / 本机较新 ' + s.admissions.localWins + '\n' +
          '事件：新增 ' + s.events.added + ' / 更新 ' + s.events.updated + '\n' +
          '自由待办：新增 ' + s.freeTodos.added + ' / 更新 ' + s.freeTodos.updated + '\n' +
          '冲突：' + merge.conflicts.length + ' · 照片：新增 ' + photoMerge.added.length + ' / 更新 ' + photoMerge.updated.length +
          '</div>' + conflictHtml;

        const self = this;
        UI.modal({
          title: '导入同步包',
          body: body,
          actions: [
            { label: '取消', className: 'ghost' },
            {
              label: '导入', className: 'primary', onClick: async function (close) {
                const selects = Array.from(document.querySelectorAll('[data-conflict]'));
                const choices = selects.map((x) => x.value);
                merge.conflicts.forEach(function (c, i) {
                  if (choices[i] !== 'remote') return;
                  const arr = merge.data[c.label];
                  const idx = arr.findIndex((x) => x.id === c.remote.id);
                  if (idx >= 0) arr[idx] = c.remote;
                });
                await Store.replaceData(merge.data);
                const byName = {};
                entries.forEach((e) => { byName[e.name] = e; });
                for (const att of photoMerge.added.concat(photoMerge.updated)) {
                  const f = byName['photos/' + att.id + '.jpg'];
                  if (!f) continue;
                  const t = byName['thumbs/' + att.id + '.jpg'];
                  const full = new Blob([f.data], { type: 'image/jpeg' });
                  const thumb = t ? new Blob([t.data], { type: 'image/jpeg' }) : null;
                  await Store.put('attachments', att);
                  await Store.put('blobs', { id: att.id, full: full, thumb: thumb });
                }
                self.state.data.meta.lastSyncAt = remote.exportedAt || Store.nowISO();
                self.state.data.meta.lastImportAt = Store.nowISO();
                await Store.saveMeta(self.state.data.meta);
                close();
                await self.reload();
                UI.toast('同步完成');
              }
            }
          ]
        });
      } catch (err) {
        UI.toast('导入失败：' + (err.message || err));
      }
    },

    async exportPhotos() {

      const manifest = { app: 'patient-manager', exportedAt: Store.nowISO(), attachments: photos.manifest };

          knee: { rom1: '', rom2: '', rom3: '', mcl: 'not_examined', lcl: 'not_examined', acl: 'not_examined', pcl: 'not_examined' },
          hip: { strength: '3', posture: '右下肢外旋' }, notes: ''
        },
        bedHistory: [], createdAt: now, updatedAt: now
      };
      const events = [
        { id: 'demo-e1', admissionId: 'demo-a1', taskType: 'preop', action: 'done', date: d(-4), note: '', createdAt: now, updatedAt: now },
        { id: 'demo-e3', admissionId: 'demo-a1', taskType: 'drain', action: 'done', date: d(-2), note: '', createdAt: now, updatedAt: now }
      ];
      const free = [{
        id: 'demo-f1', admissionId: 'demo-a3', patientId: 'demo-p3', title: '复查血常规', kind: 'custom', type: 'once', interval: 2,
        dueDate: this.state.today, note: '', createdAt: now, updatedAt: now
      }, {
        id: 'demo-f2', admissionId: '', patientId: '', title: '取检查报告', kind: 'custom', type: 'once', interval: 2,
        dueDate: this.state.today, note: '', createdAt: now, updatedAt: now
      }];
      await Store.bulkPut('patients', [p1, p2, p3]);
      await Store.bulkPut('admissions', [a1, a2, a3]);
      await Store.bulkPut('events', events);
      await Store.bulkPut('freeTodos', free);
      await this.reload();
      this.go('overview');
      UI.toast('示例数据已载入');
    },

    async clearAll() {
      const ok = await UI.confirm('清空全部患者、住院、任务、待办和照片？此操作不可撤销，建议先导出备份。', { okLabel: '全部清空', danger: true });
      if (!ok) return;
      await Store.clearBusinessData();
      await this.reload();
      UI.toast('已清空业务数据');
    },

    async reload() {
      try {
        this.state.data = await Store.loadAll();
        this.state.today = Engine.todayYMD();
        this.render();
      } catch (err) {
        UI.toast('刷新数据失败：' + (err.message || err));
      }
    }
  };

  root.App = App;
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => App.init());
  } else {
    App.init();
  }
})(typeof window !== 'undefined' ? window : globalThis);
</script>
</body>
</html>
